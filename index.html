 const {data, error} = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();

   <div class="ar" style="gap:8px"><button class="btn line sm" data-a="regs" data-id="${a.id}">المسجلون</button><button class="btn no sm" data-a="del" data-id="${a.id}">حذف</button></div></div><div id="rg${a.id}" class="mut" style="margin-top:8px;line-height:2"></div></div>`).join('') || '<div class="pan c mut">لا توجد فعاليات بعد – أضف أول فعالية من النموذج أعلاه.</div>'}`;

function tSt(){

function csv(kind){
  const l = filt(kind), h = ['الاسم','الرقم الجامعي','الجوال','القسم','السنة','اللجنة','الحالة','سبب الانضمام','التاريخ'];
  const q = x => { let s = String(x ?? ''); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const r = [h, ...l.map(p => [p.full_name, p.card_no, p.phone, p.specialization, p.year, cn(p.committee), ST[p.status], p.motivation, new Date(p.created_at).toLocaleDateString('en-GB')])];

  a.href = URL.createObjectURL(new Blob(['\ufeff' + r.map(x => x.map(q).join(',')).join('\n')], {type:'text/csv;charset=utf-8'}));

function showP(id){
  const p = P.find(x => x.id === id); if (!p) return;

  ${p.status !== 'approved' ? `<button class="btn ok sm" data-a="appr" data-id="${p.id}">قبول</button>` : ''}${p.status !== 'rejected' && p.role !== 'admin' ? `<button class="btn no sm" data-a="rej" data-id="${p.id}">رفض</button>` : ''}</div></div>`;

// ===== الأحداث =====
document.addEventListener('click', async e => {
  if (e.target.id === 'modal') { $('#modal').style.display = 'none'; return; }
  const t = e.target.closest('[data-tab]'); if (t) { e.preventDefault(); tab = t.dataset.tab; if (view === 'admin') adminTab(); return; }
  const rfb = e.target.closest('[data-rf]'); if (rfb) { rf = rfb.dataset.rf; return tRq(); }
  const mfb = e.target.closest('[data-mf]'); if (mfb) { mf = mfb.dataset.mf; return tMb(); }
  const el = e.target.closest('[data-a]'); if (!el) return;
  e.preventDefault();
  const a = el.dataset.a, id = el.dataset.id;
  if (a === 'menu') { const m = $('#menu'); m.style.display = m.style.display === 'block' ? 'none' : 'block'; return; }
  if (a === 'mx') { $('#modal').style.display = 'none'; return; }
  if (a === 'out') { await sb.auth.signOut(); me = null; stopRT(); unread = 0; MB = {}; MBL = []; await loadSettings(); nav('#home'); return; }
  if (a === 'refresh') { await loadMe(); return render(); }
  if (a === 'csv') return csv(el.dataset.w);
  if (a === 'join') {
    const {error} = await sb.from('registrations').insert({activity_id: +id, user_id: me.id});
    toast(error ? (/full/.test(error.message) ? 'اكتمل العدد' : 'تعذّر التسجيل') : 'تم تسجيلك ✓'); return render();
  }
  if (a === 'leave') { await sb.from('registrations').delete().eq('activity_id', +id).eq('user_id', me.id); toast('تم إلغاء التسجيل'); return render(); }
  if (a === 'dm') { const {error} = await sb.from('messages').delete().eq('id', id); if (error) return toast('تعذّر الحذف'); return $('#msg' + id)?.remove(); }
  if (a === 'ddm') { const {error} = await sb.from('dms').delete().eq('id', id); if (error) return toast('تعذّر الحذف'); return $('#dm' + id)?.remove(); }
    if (a === 'mkadm' || a === 'rmadm') {
    if (!confirm(a === 'mkadm' ? 'منح هذا العضو صلاحيات المشرف الكاملة؟' : 'إلغاء صلاحيات المشرف عن هذا العضو؟')) return;
    const {error} = await sb.from('profiles').update({role: a === 'mkadm' ? 'admin' : 'student'}).eq('id', id);
    if (error) return toast('تعذّر التنفيذ'); toast('تم'); return adminTab();
  }
    if (a === 'cdl') {
    const cv = $('#idc'); if (!cv) return;
    try { cv.toBlob(b => { const u = URL.createObjectURL(b), l = document.createElement('a'); l.href = u; l.download = 'LST-CLUB-card.png'; l.click(); setTimeout(() => URL.revokeObjectURL(u), 3000); }); }
    catch (err) { toast('تعذّر تحميل البطاقة'); }
    return;
  }
  if (a === 'view') return showP(id);
  if (a === 'appr' || a === 'rej') {
    if (a === 'rej' && !confirm('تأكيد الرفض / الإيقاف؟')) return;
    const {error} = await sb.from('profiles').update({status: a === 'appr' ? 'approved' : 'rejected'}).eq('id', id);
    if (error) return toast('تعذّر التنفيذ'); $('#modal').style.display = 'none'; toast('تم'); return adminTab();
  }
  if (a === 'cert') {
    const {data, error} = await sb.storage.from('certificates').createSignedUrl(el.dataset.p, 120);
    return error ? toast('تعذّر فتح الملف') : window.open(data.signedUrl, '_blank');
  }
  if (a === 'del') { if (!confirm('حذف الفعالية نهائياً؟')) return; await sb.from('activities').delete().eq('id', id); return tEv(); }
  if (a === 'regs') {
    const box = $('#rg' + id); box.textContent = '…';
    const {data} = await sb.from('registrations').select('profiles(full_name,card_no,specialization)').eq('activity_id', id);
    box.innerHTML = (data || []).length ? data.map((r, i) => `${i + 1}. ${esc(r.profiles.full_name)} — ${esc(r.profiles.specialization)} (${esc(r.profiles.card_no)})`).join('<br>') : 'لا يوجد مسجلون بعد.';
  }
});

(async () => { main.innerHTML = loader; await Promise.all([loadMe(), loadSettings()]); render(); })();

<script>
(() => {
const STICKERS = [
 {id:'hi',e:'👋',t:'مرحباً',c:'#2563eb'},{id:'thx',e:'🙏',t:'شكراً',c:'#0f9d78'},{id:'wow',e:'🤩',t:'رائع',c:'#d4a72c'},{id:'gj',e:'👏',t:'أحسنت',c:'#7c3aed'},
 {id:'ok',e:'👌',t:'تمام',c:'#0ea5e9'},{id:'lol',e:'😂',t:'هههه',c:'#f59e0b'},{id:'love',e:'😍',t:'أحببتها',c:'#e11d48'},{id:'sad',e:'😢',t:'حزين',c:'#64748b'},
 {id:'fire',e:'🔥',t:'نار',c:'#ea580c'},{id:'think',e:'🤔',t:'أفكر',c:'#0891b2'},{id:'party',e:'🎉',t:'مبروك',c:'#db2777'},{id:'sci',e:'🔬',t:'علم',c:'#0b1430'},
 {id:'rocket',e:'🚀',t:'انطلاق',c:'#1d4ed8'},{id:'bulb',e:'💡',t:'فكرة',c:'#ca8a04'},{id:'coffee',e:'☕',t:'قهوة؟',c:'#78350f'},{id:'night',e:'🌙',t:'تصبحون على خير',c:'#312e81'}];
const EMO = [
 ['وجوه','😀 😃 😄 😁 😆 😅 😂 🤣 😊 😇 🙂 😉 😍 🥰 😘 😋 😎 🤩 🥳 🤔 🤨 😐 😴 😢 😭 😤 😡 🥺 😱 🤯 😬 🙄'],
 ['إيماءات','👍 👎 👏 🙌 🙏 🤝 💪 ✌️ 🤞 👌 👋 🤙 ☝️ 👆 👇 👉 👈 ✋'],
 ['قلوب ونجوم','❤️ 🧡 💛 💚 💙 💜 🖤 🤍 💔 💕 💖 💯 ✨ 🔥 ⭐ 🌟'],
 ['علوم ودراسة','🔬 🧪 🧬 🔭 💻 ⌨️ 📱 🤖 ⚙️ 🔧 💡 🚀 🛰️ 📚 🎓 📝 📊 🏆 🥇 🎯'],
 ['متنوعة','🎉 🎊 🎁 ☕ 🍕 🌙 ☀️ 🌈 🌹 ⚽ 🎮 🎧 📷']];
const findStk = c => STICKERS.find(s => s.e + ' ' + s.t === c);
const stickerHTML = c => { const s = findStk(c); return s ? `<div class="stkr" style="--c:${s.c}"><span>${s.e}</span><b>${esc(s.t)}</b></div>` : esc(c); };
const MEDIA = /^https:\/\/[A-Za-z0-9.-]+\.supabase\.co\/storage\/v1\/object\/public\/media\/[A-Za-z0-9._\/-]+$/;
const okImg = u => MEDIA.test(u || '') ? esc(u) : '';
let CSEND = null, CPEND = null, CURG = null, GMEM = [], GR = [], GC = {}, GM = new Set(), AS = {}, ML = new Set();

// ===== الصور =====
const compress = (file, max, q) => new Promise((res, rej) => {
  const im = new Image(), u = URL.createObjectURL(file);
  im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
    c.toBlob(b => b ? res(b) : rej(new Error('img')), 'image/jpeg', q); };
  im.onerror = () => rej(new Error('img')); im.src = u; });
async function uploadMedia(file){
  const blob = await compress(file, 1280, .8), path = `${me.id}/${crypto.randomUUID()}.jpg`;
  const up = await sb.storage.from('media').upload(path, blob, {contentType:'image/jpeg'});
  if (up.error) throw up.error;
  return sb.storage.from('media').getPublicUrl(path).data.publicUrl;
}

// ===== شريط الكتابة =====
const composer = ph => `<div id="pnl" class="pnl" style="display:none"></div><div id="prev"></div>
<form id="cf" class="cbar2"><button type="button" class="ib" data-a="emo" aria-label="إيموجي">😊</button><button type="button" class="ib" data-a="stk" aria-label="ستيكر">🎭</button>
<label class="ib" aria-label="صورة">🖼️<input type="file" id="cpic" accept="image/*" hidden></label><label class="ib" aria-label="كاميرا">📷<input type="file" id="ccam" accept="image/*" capture="environment" hidden></label>
<input name="t" maxlength="1000" placeholder="${ph}" autocomplete="off"><button class="btn gold sm" aria-label="إرسال">${ic('send',18)}</button></form>`;
const setPend = f => { CPEND = f; const p = $('#prev'); if (p) p.innerHTML = f ? `<div class="pv"><img src="${URL.createObjectURL(f)}" alt=""><button type="button" class="ib" data-a="pvx">✕</button></div>` : ''; };
function bindComposer(){
  const f = $('#cf'); if (!f) return;
  ['cpic','ccam'].forEach(id => { const i = $('#' + id); i.onchange = () => { const x = i.files[0]; i.value = ''; if (!x) return; if (!x.type.startsWith('image/')) return toast('اختر صورة'); setPend(x); }; });
  f.onsubmit = async e => {
    e.preventDefault(); const t = f.t.value.trim(); if (!t && !CPEND) return;
    const b = f.querySelector('.btn'); b.disabled = true;
    try {
      const url = CPEND ? await uploadMedia(CPEND) : null;
      if (await CSEND({content: t || '📷 صورة', kind:'text', image_url: url})) { f.t.value = ''; setPend(null); } else toast('تعذّر الإرسال');
    } catch (err) { toast('تعذّر رفع الصورة'); }
    b.disabled = false;
  };
}
function showPanel(kind){
  const p = $('#pnl'); if (!p) return;
  if (p.dataset.k === kind && p.style.display !== 'none') { p.style.display = 'none'; return; }
  p.dataset.k = kind; p.style.display = 'block';
  p.innerHTML = kind === 'emo'
    ? EMO.map(([t, s]) => `<h5>${t}</h5><div class="eg">${s.split(' ').map(e => `<button type="button" data-a="emj" data-e="${e}">${e}</button>`).join('')}</div>`).join('')
    : `<div class="sg">${STICKERS.map(s => `<button type="button" data-a="stks" data-id="${s.id}">${stickerHTML(s.e + ' ' + s.t)}</button>`).join('')}</div>`;
}

// ===== فقاعات الرسائل =====
function bub(r, t){
  const uid = t === 'd' ? r.sender_id : r.user_id, own = uid === me.id, p = MB[uid];
  const pre = t === 'g' ? 'msg' : t === 'd' ? 'dm' : 'gm', act = t === 'g' ? 'dm' : t === 'd' ? 'ddm' : 'gdm';
  const del = own || (t !== 'd' && me.role === 'admin') || (t === 'k' && CURG && CURG.owner_id === me.id);
  const sk = r.kind === 'sticker', img = okImg(r.image_url), showN = t !== 'd' && !own;
  const body = sk ? stickerHTML(r.content)
    : `${img ? `<img class="mi" src="${img}" data-a="img" data-u="${img}" alt="" loading="lazy">` : ''}${img && r.content === '📷 صورة' ? '' : `<div>${esc(r.content)}</div>`}`;
  return `<div class="msg ${own ? 'me' : ''}" id="${pre}${r.id}">${showN ? `<a href="#u/${uid}">${av(p || {full_name: r.author_name}, 34)}</a>` : ''}<div class="mb${sk ? ' stk' : ''}">${showN ? `<div class="mn"><a href="#u/${uid}">${esc(r.author_name || p?.full_name || 'عضو')}</a></div>` : ''}${body}<div class="mt">${hm(r.created_at)}${del ? ` <a href="#" data-a="${act}" data-id="${r.id}">🗑</a>` : ''}</div></div></div>`;
}
function pushB(id, html, force){
  const box = $('#mbox'); if (!box || document.getElementById(id)) return;
  $('#empty')?.remove();
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 160;
  box.insertAdjacentHTML('beforeend', html);
  if (near || force) box.scrollTop = box.scrollHeight;
}
const emptyMsg = '<div class="c mut" id="empty" style="padding:30px">ابدأ المحادثة 👋</div>';

// المحادثة العامة
window.pChat = async function(){
  main.innerHTML = `<div class="chw">${cts('chat')}<div class="chat"><div id="mbox" class="msgs">${loader}</div>${composer('اكتب رسالة للجميع…')}</div></div>`;
  const {data} = await sb.from('messages').select('*').order('created_at', {ascending:false}).limit(100);
  const box = $('#mbox'); if (!box || view !== 'chat') return;
  box.innerHTML = (data || []).length ? data.reverse().map(r => bub(r, 'g')).join('') : emptyMsg;
  box.scrollTop = box.scrollHeight;
  chan = sb.channel('chat-room')
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'messages'}, p => pushB('msg' + p.new.id, bub(p.new, 'g')))
    .on('postgres_changes', {event:'DELETE', schema:'public', table:'messages'}, p => $('#msg' + p.old.id)?.remove()).subscribe();
  CSEND = async o => { const {data, error} = await sb.from('messages').insert(o).select().single(); if (error) return false; pushB('msg' + data.id, bub(data, 'g'), true); return true; };
  bindComposer();
};

window.onDM = async function(p){

};

document.addEventListener('click', async e => {

});

<script>
(() => {
const hasDomains = typeof DOMAINS !== 'undefined' && typeof flat === 'function';

// ===== نموذج الانضمام: شهادة الجامعة (مع استكمال التسجيل المقطوع) =====
const _pj = window.pJoin;
window.pJoin = function(){
  _pj();
  const f = document.getElementById('jf'); if (!f || f.dataset.v2) return; f.dataset.v2 = '1';
  f.onsubmit = async e => {
    e.preventDefault();
    const v = n => f[n].value.trim(), card = v('card'), phone = v('phone').replace(/\s/g, ''), pw = f.pw.value, why = v('why'), file = f.cert.files[0];
    if (!/^[A-Za-z0-9]{4,20}$/.test(card)) return toast('الرقم الجامعي: 4 إلى 20 حرفاً/رقماً إنجليزياً');
    if (!/^\+?\d{9,15}$/.test(phone)) return toast('رقم الجوال غير صالح');
    if (pw.length < 6) return toast('كلمة المرور قصيرة');
    if (!f.comm.value) return toast('اختر لجنة');
    if (why.length < 20) return toast('اكتب 20 حرفاً على الأقل في سبب الانضمام');
    if (!file) return toast('ارفع شهادة الجامعة');
    if (file.size > 5 * 1024 * 1024) return toast('حجم الملف أكبر من 5MB');
    const b = f.querySelector('button.gold'); b.disabled = true;
    const reset = () => b.disabled = false;
    let uid;
    const su = await sb.auth.signUp({email: emailOf(card), password: pw});
    if (su.error && /registered|already/i.test(su.error.message)) {
      const si = await sb.auth.signInWithPassword({email: emailOf(card), password: pw});
      if (si.error) { reset(); return toast('الرقم الجامعي مسجّل مسبقاً. إن كنت بدأت التسجيل سابقاً فأعد المحاولة بنفس كلمة المرور، أو سجّل الدخول.'); }
      const ex = await sb.from('profiles').select('id').eq('id', si.data.user.id).maybeSingle();
      if (ex.data) { await sb.auth.signOut(); reset(); return toast('هذا الحساب مسجّل مسبقاً، سجّل الدخول.'); }
      uid = si.data.user.id;
    } else if (su.error) { reset(); return toast(su.error.message); }
    else { if (!su.data.session) { reset(); return toast('عطّل تأكيد البريد في إعدادات Supabase Auth'); } uid = su.data.user.id; }
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5) || 'jpg';
    const pc = `${uid}/certificate.${ext}`;
    const up = await sb.storage.from('certificates').upload(pc, file);
    if (up.error && !/exist|duplicate/i.test(up.error.message || '')) { reset(); return toast('فشل رفع الشهادة. أعد المحاولة بنفس البيانات وكلمة المرور.'); }
    const ins = await sb.from('profiles').insert({id: uid, full_name: v('fullname'), specialization: f.dept.value, year: f.year.value, card_no: card, phone, committee: f.comm.value, motivation: why, certificate_url: pc});
    if (ins.error) { reset(); return toast('تعذّر حفظ البيانات. أعد المحاولة بنفس كلمة المرور.'); }
    await loadMe(); nav('#pending');
  };
};

// ===== نافذة الطلب للمشرف: سجل تغيير الاسم وحذف الشهادة =====

  sb.from('profile_audit').select('old_name,new_name,created_at').eq('user_id', id).order('created_at', {ascending: false}).limit(5).then(r => {
    if (r.data && r.data.length && box.isConnected) box.insertAdjacentHTML('beforeend', `<p class="mut" style="margin-top:14px;font-size:.85rem;line-height:2">سجل تغيير الاسم:<br>${r.data.map(x => `${esc(x.old_name)} ← ${esc(x.new_name)} (${shortT(x.created_at)})`).join('<br>')}</p>`);
  });

// ===== ملفي الشخصي: تعديل البيانات =====
const _pm = window.pMe;
window.pMe = function(){
  _pm();
  const f = document.getElementById('pfm'); if (!f || !me) return;
  const cur = me.specialization || '';
  const yearOpts = '<option value="">—</option>' + YEARS.map(y => `<option${me.year === y ? ' selected' : ''}>${esc(y)}</option>`).join('');
  let specHTML, domIdx = hasDomains ? DOMAINS.findIndex(d => flat(d.it).includes(cur)) : -1;
  const curOpt = cur && !(hasDomains ? domIdx >= 0 : DEPTS.includes(cur)) ? `<option selected>${esc(cur)}</option>` : '';
  if (hasDomains) {
    specHTML = `<div class="fl">${ic('graduation',20)}الميدان</div><select name="dom"><option value="">اختر الميدان</option>${DOMAINS.map((d, i) => `<option value="${i}"${i === domIdx ? ' selected' : ''}>${esc(d.n)}</option>`).join('')}</select>
    <div class="fl">${ic('graduation',20)}القسم / التخصص</div><select name="spec" required>${curOpt}${domIdx >= 0 ? optsOf(DOMAINS[domIdx].it).replace(`<option>${esc(cur)}</option>`, `<option selected>${esc(cur)}</option>`) : ''}</select>`;
  } else {
    specHTML = `<div class="fl">${ic('graduation',20)}القسم / التخصص</div><select name="spec" required>${curOpt}${DEPTS.map(d => `<option${d === cur ? ' selected' : ''}>${esc(d)}</option>`).join('')}</select>`;
  }
  f.innerHTML = `<div class="fl" style="margin-top:0">${ic('user',20)}الاسم الكامل</div><input name="name" required minlength="3" maxlength="80" value="${esc(me.full_name)}">
  ${specHTML}
  <div class="fl">${ic('graduation',20)}السنة الدراسية</div><select name="year">${yearOpts}</select>
  <div class="fl">${ic('phone',20)}رقم الجوال</div><input name="phone" type="tel" value="${esc(me.phone || '')}">
  <div class="fl">${ic('chat',20)}نبذة عنك (300 حرف)</div><textarea name="bio" maxlength="300" style="min-height:110px" placeholder="عرّف بنفسك واهتماماتك…">${esc(me.bio || '')}</textarea>
  <button class="btn navy block" style="margin-top:20px">${ic('save',20)}حفظ التعديلات</button>
  <p class="note">الرقم الجامعي والقسم (اللجنة) يحدّدهما المشرف، ولا يمكن تغييرهما من هنا. يُسجَّل أي تغيير في الاسم ويراه المشرفون.</p>`;
  if (hasDomains && f.dom) f.dom.onchange = () => { const d = DOMAINS[f.dom.value]; f.spec.innerHTML = '<option value="">اختر التخصص</option>' + (d ? optsOf(d.it) : ''); };
  f.onsubmit = async e => {
    e.preventDefault(); const b = f.querySelector('button.navy'); b.disabled = true;
    const phone = f.phone.value.trim();
    if (phone && !/^\+?\d{9,15}$/.test(phone.replace(/\s/g, ''))) { b.disabled = false; return toast('رقم الجوال غير صالح'); }
    if (!f.spec.value) { b.disabled = false; return toast('اختر التخصص'); }
    const r = await sb.rpc('update_profile_full', {p_name: f.name.value.trim(), p_spec: f.spec.value, p_year: f.year.value, p_phone: phone, p_bio: f.bio.value.trim()});
    b.disabled = false;
    if (r.error) return toast('تعذّر الحفظ، تحقق من البيانات');
    await loadMe(); drawShell(); toast('تم حفظ التعديلات ✓'); pMe();
  };
};

// ===== حذف الشهادة بعد التحقق (اختياري للمشرف) =====
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a="docdel"]'); if (!el) return;
  if (!confirm('حذف شهادة الجامعة نهائياً من التخزين؟ تأكد أنك تحققت منها أولاً.')) return;
  const p = P.find(x => x.id === el.dataset.id); if (!p) return;
  if (p.certificate_url) await sb.storage.from('certificates').remove([p.certificate_url]);
  const {error} = await sb.from('profiles').update({certificate_url: null}).eq('id', p.id);
  if (error) return toast('تعذّر التنفيذ');
  toast('تم حذف الشهادة ✓'); document.getElementById('modal').style.display = 'none'; adminTab();
});
})();

// ===== Word: كتابة ملف docx بدون أي مكتبة =====
const CT = new Uint32Array(256);
for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; CT[n] = c >>> 0; }
const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CT[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function zipBlob(files){
  const enc = new TextEncoder(), parts = [], cen = []; let off = 0;
  const u16 = n => [n & 255, (n >> 8) & 255], u32 = n => [n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >>> 24) & 255];
  files.forEach(f => {
    const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data), sz = data.length;
    const lh = new Uint8Array([0x50, 0x4b, 3, 4, ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(sz), ...u32(sz), ...u16(name.length), ...u16(0)]);
    parts.push(lh, name, data); cen.push({name, crc, sz, off}); off += lh.length + name.length + sz;
  });
  let csize = 0;
  cen.forEach(c => {
    const h = new Uint8Array([0x50, 0x4b, 1, 2, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(c.crc), ...u32(c.sz), ...u32(c.sz), ...u16(c.name.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(c.off)]);
    parts.push(h, c.name); csize += h.length + c.name.length;
  });
  parts.push(new Uint8Array([0x50, 0x4b, 5, 6, 0, 0, 0, 0, ...u16(files.length), ...u16(files.length), ...u32(csize), ...u32(off), 0, 0]));
  return new Blob(parts, {type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
const XM = s => String(s ?? '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;'}[c]));
function buildDocx(title, sub, head, rows, widths){
  const rf = '<w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>';
  const cell = (t, w, o = {}) => { const sz = o.sz || 22, szc = o.rtl ? sz + 4 : sz;
    return `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${o.fill ? `<w:shd w:val="clear" w:color="auto" w:fill="${o.fill}"/>` : ''}<w:vAlign w:val="center"/></w:tcPr><w:p><w:pPr>${o.rtl ? '<w:bidi/>' : ''}<w:jc w:val="center"/></w:pPr><w:r><w:rPr>${rf}${o.b ? '<w:b/><w:bCs/>' : ''}<w:color w:val="${o.col || '000000'}"/><w:sz w:val="${sz}"/><w:szCs w:val="${szc}"/>${o.rtl ? '<w:rtl/>' : ''}</w:rPr><w:t xml:space="preserve">${XM(t)}</w:t></w:r></w:p></w:tc>`; };
  const para = (t, sz, b, col) => `<w:p><w:pPr><w:bidi/><w:spacing w:after="120"/><w:jc w:val="center"/></w:pPr><w:r><w:rPr>${rf}${b ? '<w:b/><w:bCs/>' : ''}<w:color w:val="${col}"/><w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/><w:rtl/></w:rPr><w:t xml:space="preserve">${XM(t)}</w:t></w:r></w:p>`;
  const total = widths.reduce((a, b) => a + b, 0), bd = k => `<w:${k} w:val="single" w:sz="4" w:space="0" w:color="9AA8C7"/>`;
  const hr = `<w:tr><w:trPr><w:tblHeader/></w:trPr>${head.map((h, i) => cell(h, widths[i], {fill: '0B1430', col: 'FFFFFF', b: 1, rtl: 1})).join('')}</w:tr>`;
  const br = rows.map((r, ri) => `<w:tr><w:trPr><w:cantSplit/></w:trPr>${r.map((v, i) => cell(v, widths[i], {fill: ri % 2 ? 'F3F6FB' : '', rtl: i === 1})).join('')}</w:tr>`).join('');
  const tbl = `<w:tbl><w:tblPr><w:bidiVisual/><w:tblW w:w="${total}" w:type="dxa"/><w:jc w:val="center"/><w:tblBorders>${['top', 'left', 'bottom', 'right', 'insideH', 'insideV'].map(bd).join('')}</w:tblBorders><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>${widths.map(w => `<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>${hr}${br}</w:tbl>`;
  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${para(title, 40, 1, '0B1430')}${para(sub, 24, 0, '5F6F8F')}${tbl}<w:p/><w:sectPr><w:pgSz w:w="16838" w:h="11906" w:orient="landscape"/><w:pgMar w:top="720" w:right="720" w:bottom="720" w:left="720" w:header="360" w:footer="360" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  return zipBlob([
    {name: '[Content_Types].xml', text: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>'},
    {name: '_rels/.rels', text: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'},
    {name: 'word/document.xml', text: doc}]);
}

    const blob = buildDocx(`قائمة المنضمين إلى ${S.club_name}`, sub, ['#', 'الاسم واللقب', 'رقم بطاقة الطالب', 'البريد الإلكتروني', 'رقم الهاتف'],

<script>
(() => {
const VAPID_PUBLIC = 'BE5KevOazxDHBVRTtI-W4v7vfYuSimVSHn-JispiEXTAIDxsvrMt4fZH3wki6MDekIyREXGyItBJ4oKgyWRmzac';
const configured = /^[A-Za-z0-9_-]{80,}$/.test(VAPID_PUBLIC);
const supported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const needInstall = () => iOS && !standalone();
const toKey = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const b = atob(s), o = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) o[i] = b.charCodeAt(i); return o; };
const fromBuf = buf => { let s = ''; new Uint8Array(buf).forEach(x => s += String.fromCharCode(x)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const flag = () => 'lst_push_' + (me ? me.id : '');
const getReg = async () => { await navigator.serviceWorker.register('sw.js'); return navigator.serviceWorker.ready; };
async function currentSub(){ try { const r = await navigator.serviceWorker.getRegistration(); return r ? await r.pushManager.getSubscription() : null; } catch (e) { return null; } }
const send = sub => { const j = sub.toJSON(); return sb.rpc('register_push', {p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth}); };

async function pushOn(){
  if (!supported()) return 'unsupported';
  const perm = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
  if (perm !== 'granted') return 'denied';
  let reg; try { reg = await getReg(); } catch (e) { return 'error'; }
  let sub = await reg.pushManager.getSubscription();
  if (sub && sub.options && sub.options.applicationServerKey && fromBuf(sub.options.applicationServerKey) !== VAPID_PUBLIC) { try { await sub.unsubscribe(); } catch (e) {} sub = null; }
  const make = () => reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: toKey(VAPID_PUBLIC)});
  try { if (!sub) sub = await make(); } catch (e) { return 'error'; }
  const r = await send(sub); if (r.error) return 'server';
  try { localStorage.setItem(flag(), '1'); } catch (e) {}
  return 'ok';
}
async function pushOff(unsub){
  try { const sub = await currentSub(); if (sub) { await sb.rpc('unregister_push', {p_endpoint: sub.endpoint}); if (unsub) await sub.unsubscribe(); } } catch (e) {}
  if (unsub) { try { localStorage.removeItem(flag()); } catch (e) {} }
}
const loadPrefs = async () => { const {data} = await sb.from('push_prefs').select('dm,grp,ev').eq('user_id', me.id).maybeSingle(); return Object.assign({dm: true, grp: true, ev: true}, data || {}); };
const MSG = {unsupported: 'هذا المتصفح لا يدعم الإشعارات.', denied: 'لم يُسمح بالإشعارات. فعّلها من إعدادات المتصفح ثم أعد المحاولة.', error: 'تعذّر تفعيل الإشعارات على هذا الجهاز.', server: 'تعذّر الحفظ على الخادم، حاول لاحقاً.'};

  else if (!supported()) html = 'هذا المتصفح لا يدعم الإشعارات. جرّب Chrome على أندرويد.';
  else if (Notification.permission === 'denied') html = 'الإشعارات محظورة لهذا الموقع. فعّلها من إعدادات المتصفح: ⋮ ← الإعدادات ← إعدادات الموقع ← الإشعارات، ثم أعد تحميل الصفحة.';

    else {
      const p = await loadPrefs(); if (!document.getElementById('pushbody')) return;
      const row = (k, t) => `<label class="pfr"><input type="checkbox" data-pf="${k}" ${p[k] ? 'checked' : ''}><span>${t}</span></label>`;
      html = `<p style="margin:0 0 8px;color:var(--ok);font-weight:700">✅ الإشعارات مفعّلة على هذا الجهاز</p>${row('dm', 'الرسائل الخاصة')}${row('grp', 'رسائل المجموعات')}${row('ev', 'الفعاليات الجديدة')}
      <div class="row"><button class="btn line sm" data-a="pushtest">إشعار تجريبي</button><button class="btn line sm" data-a="pushoff">إيقاف على هذا الجهاز</button></div>`;
    }
  }
  box.className = ''; box.innerHTML = html;
}

  if (!configured || me.status !== 'approved' || !supported() || initFor === me.id) return;

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a="out"]'); if (!el) return;
  if (passOut) { passOut = false; return; }

// ===== الأزرار =====
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a;
  if (a === 'pushon' || a === 'pushbn') {
    e.preventDefault(); el.disabled = true;

    if (r === 'ok') { toast('تم تفعيل الإشعارات ✓'); if (view === 'me') drawPanel(); } else toast(MSG[r] || MSG.error);

  }
  if (a === 'pushlater') { e.preventDefault(); try { localStorage.setItem('lst_push_dismiss', '1'); } catch (err) {} document.getElementById('pbn')?.remove(); return; }

    try { const reg = await getReg(); await reg.showNotification('LST CLUB', {body: '✅ الإشعارات تعمل على جهازك', icon: 'icon-192.png', tag: 'test', dir: 'rtl', lang: 'ar'}); } catch (err) { toast('تعذّر عرض الإشعار'); }
  }
});
document.addEventListener('change', async e => {

if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'nav' && e.data.url) location.href = e.data.url; });
})();

<style>
.s-interview{background:#e0ecff;color:#1d4ed8}

<script>
(() => {
ST.interview = 'مقابلة';
const closeX = '<button class="ib" data-a="mx" style="position:absolute;left:14px;top:14px;font-size:1.2rem">✕</button>';
const toLocalInput = iso => { if (!iso) return ''; const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const dt = iso => new Date(iso).toLocaleString('ar-u-nu-latn', {dateStyle: 'long', timeStyle: 'short'});
const waNum = ph => { let d = String(ph || '').replace(/\D/g, ''); if (d.startsWith('0')) d = '213' + d.slice(1); return d; };

// ===== 1) مواسم التقديم =====
function applyState(){
  const m = S.apply_mode || 'open', f = S.apply_from ? new Date(S.apply_from) : null, u = S.apply_until ? new Date(S.apply_until) : null, now = new Date();
  if (m === 'closed') return {open: false, msg: S.apply_msg};
  if (m === 'dates') {
    if (f && now < f) return {open: false, msg: S.apply_msg, next: f, future: true};
    if (u && now > u) return {open: false, msg: S.apply_msg};
    return {open: true, until: u};
  }
  return {open: true};
}
function closedPage(st){
  main.innerHTML = `<section class="dark ph" style="padding-bottom:90px"><span class="pill">${ic('flask',18)} ${esc(S.club_name)}</span><h1>التقديم مغلق حالياً</h1></section>
  <div class="fcard c"><div style="font-size:3rem">🔒</div><p class="mut" style="margin:10px 0;line-height:2.1">${esc(st.msg || 'يفتح باب الانضمام في مواسم محددة من السنة. تابع صفحة الفعاليات والإعلانات ليصلك الخبر.')}</p>
  ${st.future ? `<p style="line-height:2">يفتح باب التقديم في <b>${dt(st.next)}</b></p>` : ''}
  <div class="row" style="justify-content:center"><a class="btn gold" href="#events">الفعاليات والإعلانات</a><a class="btn line" href="#login">لديّ حساب</a></div></div>`;
}
const _pj = window.pJoin;
window.pJoin = function(){
  const st = applyState();
  if (!st.open) { closedPage(st); return; }
  _pj();
  const f = document.getElementById('jf'); if (!f || f.dataset.sc) return; f.dataset.sc = '1';
  if (st.until) { const h = main.querySelector('.ph'); if (h) h.insertAdjacentHTML('beforeend', `<p style="margin-top:14px;color:var(--gold);font-weight:700">⏳ التقديم مفتوح حتى ${dt(st.until)}</p>`); }
  const old = f.onsubmit;
  f.onsubmit = async e => {
    e.preventDefault();
    const r = await sb.rpc('applications_open');
    if (r.data === false) { await loadSettings(); toast('أُغلق باب التقديم'); return window.render(); }
    return old.call(f, e);
  };
};
const _ph = window.pHome;
window.pHome = function(){
  const r = _ph();
  try {
    const st = applyState(), b = document.querySelector('.hbtn');
    if (b && !me) b.insertAdjacentHTML('afterend', `<p style="margin-top:16px;color:#b8c3de;font-weight:600">${st.open ? (st.until ? '⏳ التقديم مفتوح حتى ' + dt(st.until) : '✅ باب الانضمام مفتوح') : '🔒 التقديم مغلق حالياً' + (st.future ? ' — يفتح في ' + dt(st.next) : '')}</p>`);
  } catch (e) {}
  return r;
};

// إعدادات المواسم + رؤساء الأقسام داخل تبويب الإعدادات
function drawSeasonPanel(){
  const box = document.getElementById('seas-box'); if (!box) return;

  const status = st.open ? (st.until ? '✅ مفتوح حتى ' + dt(st.until) : '✅ مفتوح') : ('🔒 مغلق' + (st.future ? ' — يفتح في ' + dt(st.next) : ''));
  box.innerHTML = `<form class="pan" id="sf2"><h3><i class="g">${ic('calendar',24)}</i>مواسم التقديم</h3>
  <p style="margin:0 0 6px;font-weight:700">الحالة الآن: ${status}</p>
  <div class="fl">وضع باب الانضمام</div><select name="m"><option value="open"${m === 'open' ? ' selected' : ''}>مفتوح دائماً</option><option value="dates"${m === 'dates' ? ' selected' : ''}>مفتوح بين تاريخين</option><option value="closed"${m === 'closed' ? ' selected' : ''}>مغلق</option></select>
  <div class="g2"><div><div class="fl">يبدأ</div><input type="datetime-local" name="f" value="${toLocalInput(S.apply_from)}"></div><div><div class="fl">ينتهي</div><input type="datetime-local" name="u" value="${toLocalInput(S.apply_until)}"></div></div>
  <div class="fl">رسالة تظهر للزوار عند الإغلاق (اختياري)</div><input name="msg" maxlength="200" value="${esc(S.apply_msg || '')}" placeholder="مثال: يفتح التقديم مجدداً بداية الشهر القادم">
  <div class="row"><button class="btn navy sm">حفظ</button></div>
  <div class="fl" style="margin-top:18px">اختصارات</div><div class="row" style="margin:0"><button type="button" class="btn line sm" data-a="seasq" data-d="7">افتح الآن 7 أيام</button><button type="button" class="btn line sm" data-a="seasq" data-d="14">14 يوماً</button><button type="button" class="btn line sm" data-a="seasq" data-d="30">30 يوماً</button><button type="button" class="btn no sm" data-a="seasx">أغلق الآن</button></div></form>`;
  document.getElementById('sf2').onsubmit = async e => {
    e.preventDefault(); const f = e.target;
    const fr = f.f.value ? new Date(f.f.value).toISOString() : null, un = f.u.value ? new Date(f.u.value).toISOString() : null;
    if (f.m.value === 'dates' && !fr && !un) return toast('حدّد تاريخ البداية أو النهاية');
    if (fr && un && new Date(un) <= new Date(fr)) return toast('تاريخ النهاية يجب أن يكون بعد البداية');
    saveSeason({apply_mode: f.m.value, apply_from: fr, apply_until: un, apply_msg: f.msg.value.trim() || null});
  };
}
async function saveSeason(o){
  const {error} = await sb.from('settings').update(o).eq('id', 1);
  if (error) return toast('تعذّر الحفظ. تأكد من تنفيذ كود SQL');
  await loadSettings(); toast('تم حفظ إعدادات التقديم ✓'); drawSeasonPanel();
}
async function drawHeadsPanel(){
  const box = document.getElementById('heads-box'); if (!box) return;

  const box2 = document.getElementById('heads-box'); if (!box2) return;
  const cand = P.filter(p => p.status === 'approved' && p.role !== 'admin');

  <p class="mut" style="line-height:2">يرى الرئيس طلبات قسمه ويحدّد المقابلات ويقبل المتقدمين ويرفضهم ويكتب الملاحظات، ولا يملك صلاحيات المشرف الأخرى. ولكل قسم رئيس واحد، وتغييره يلغي رئاسة السابق.</p>
  ${COMMS.map(c => { const cur = P.find(p => p.head_of === c.k); return `<div class="fl">${esc(c.t)}</div><select data-hd="${c.k}"><option value="">— بدون رئيس —</option>${cand.map(p => `<option value="${p.id}"${cur && cur.id === p.id ? ' selected' : ''}>${esc(p.full_name)}</option>`).join('')}</select>`; }).join('')}</div>`;
}
const _ts = window.tSt;
window.tSt = function(){
  _ts();
  const sub = document.querySelector('#ac .sub'); if (!sub) return;
  sub.insertAdjacentHTML('afterend', '<div id="seas-box"></div><div id="heads-box"></div>');
  drawSeasonPanel(); drawHeadsPanel();
};

// ===== 2 و 3) المتقدمون والمقابلات والملاحظات (للمشرف ولرئيس القسم) =====
let AP2 = [], apF = 'pending', apC = '', apQ = '', apFixed = null;
async function loadAp(){
  const q = sb.from('profiles').select('*').order('created_at', {ascending: false});
  const {data, error} = await (apFixed ? q.eq('committee', apFixed) : q);
  if (error) return false;
  AP2 = (data || []).filter(p => p.id !== me.id && p.role !== 'admin'); return true;
}
function drawAp(){
  const chips = document.getElementById('apchips'), box = document.getElementById('apbox'); if (!chips || !box) return;
  const base = AP2.filter(p => !apC || p.committee === apC), cnt = s => base.filter(p => p.status === s).length;
  chips.innerHTML = [['pending', 'قيد المراجعة'], ['interview', 'مقابلة'], ['approved', 'الأعضاء'], ['rejected', 'مرفوضون']].map(([k, t]) => `<button data-apf="${k}" class="${apF === k ? 'on' : ''}">${t} (${cnt(k)})</button>`).join('');
  const qq = apQ.trim().toLowerCase();
  const l = base.filter(p => p.status === apF && (!qq || (p.full_name + ' ' + p.card_no + ' ' + (p.phone || '')).toLowerCase().includes(qq)));
  box.innerHTML = l.map(p => `<div class="pan" style="padding:16px 18px"><div class="ar"><div class="who"><span class="av">${esc(ini(p.full_name))}</span><div><b>${esc(p.full_name)}</b>
  <div class="mut" style="font-size:.85rem">${esc(p.specialization)}${p.year ? ' · ' + esc(p.year) : ''} · ${esc(cn(p.committee))}</div>
  ${p.status === 'interview' && p.interview_at ? `<div style="color:#1d4ed8;font-size:.85rem;font-weight:600">📅 ${dt(p.interview_at)}${p.interview_place ? ' · ' + esc(p.interview_place) : ''}</div>` : ''}</div></div>
  <button class="btn navy sm" data-a="apopen" data-id="${p.id}">فتح</button></div></div>`).join('') || '<div class="pan c mut">لا توجد نتائج.</div>';
}
async function renderApplicants(el, fixed){
  apFixed = fixed || null; apC = fixed || '';
  el.innerHTML = loader;
  const ok = await loadAp(); if (!document.body.contains(el)) return;
  if (!ok) { el.innerHTML = '<div class="pan c mut">تعذّر تحميل البيانات. تأكد من تنفيذ كود SQL.</div>'; return; }
  el.innerHTML = `<div class="fc" id="apchips"></div><div class="pan"><div class="sr"><input id="apq" placeholder="ابحث بالاسم أو الرقم الجامعي أو الجوال…">${ic('search',20)}</div>
  ${fixed ? '' : `<select id="apc"><option value="">كل الأقسام</option>${COMMS.map(c => `<option value="${c.k}">${esc(c.t)}</option>`).join('')}</select>`}</div><div id="apbox"></div>`;
  apQ = ''; drawAp();
}
async function afterChange(){
  if (document.getElementById('apbox')) { await loadAp(); drawAp(); }
  else if (view === 'admin') adminTab();
}
async function appModal(id){
  const p = AP2.find(x => x.id === id) || P.find(x => x.id === id); if (!p) return;
  const {data: notes} = await sb.from('applicant_notes').select('*').eq('applicant_id', id).order('created_at');
  const act = p.status !== 'approved', isInt = p.status === 'interview';
  const invite = isInt && p.phone && p.interview_at ? `https://wa.me/${waNum(p.phone)}?text=${encodeURIComponent(`مرحباً ${p.full_name}،\nتمت دعوتك لمقابلة الانضمام إلى ${S.club_name}:\n📅 ${dt(p.interview_at)}${p.interview_place ? '\n📍 ' + p.interview_place : ''}\nنرجو تأكيد الحضور.`)}` : '';
  const m = document.getElementById('modal');
  m.innerHTML = `<div class="box" style="max-width:600px">${closeX}<h3 style="margin-bottom:6px">${esc(p.full_name)}</h3><span class="st2 s-${p.status}">${ST[p.status] || p.status}</span>
  <dl class="dl"><dt>الرقم الجامعي</dt><dd>${esc(p.card_no)}</dd><dt>الجوال</dt><dd>${esc(p.phone || '—')}</dd><dt>البريد</dt><dd>${esc(p.email || '—')}</dd><dt>التخصص</dt><dd>${esc(p.specialization)}${p.year ? ' · ' + esc(p.year) : ''}</dd><dt>القسم المختار</dt><dd>${esc(cn(p.committee))}</dd><dt>تاريخ الطلب</dt><dd>${dt(p.created_at)}</dd></dl>
  <b>لماذا يريد الانضمام؟</b><p class="mut" style="margin:6px 0 12px;line-height:2">${esc(p.motivation || '—')}</p>
  ${p.certificate_url ? `<button class="btn line sm" data-a="cert" data-p="${esc(p.certificate_url)}">${ic('file',16)}شهادة الجامعة</button>` : ''}
  ${act ? `<div class="pan" style="padding:14px;margin:14px 0"><b>📅 المقابلة</b><div class="g2"><div><div class="fl">الموعد</div><input type="datetime-local" id="iat" value="${toLocalInput(p.interview_at)}"></div><div><div class="fl">المكان</div><input id="ipl" maxlength="120" value="${esc(p.interview_place || '')}" placeholder="مثال: قاعة النادي"></div></div>
  <div class="row" style="margin-top:10px"><button class="btn navy sm" data-a="ivset" data-id="${p.id}">${isInt ? 'تحديث موعد المقابلة' : 'حدّد المقابلة'}</button>${invite ? `<a class="btn ok sm" target="_blank" rel="noopener" href="${invite}">دعوة عبر واتساب</a>` : ''}</div></div>
  <div class="row"><button class="btn ok sm" data-a="apst" data-id="${p.id}" data-s="approved">✔ قبول</button><button class="btn no sm" data-a="apst" data-id="${p.id}" data-s="rejected">✖ رفض</button>${p.status !== 'pending' ? `<button class="btn line sm" data-a="apst" data-id="${p.id}" data-s="pending">↩ إعادة للانتظار</button>` : ''}</div>` : ''}
  <h4 style="margin:18px 0 6px">📝 ملاحظات داخلية <small class="mut">(يراها المشرفون ورئيس القسم فقط)</small></h4>
  ${(notes || []).map(n => `<div class="apn"><b>${esc(n.author_name || 'مشرف')}</b> <small>${shortT(n.created_at)}</small>${(n.author_id === me.id || me.role === 'admin') ? ` <a href="#" data-a="ntdel" data-id="${n.id}" data-u="${p.id}">🗑</a>` : ''}<br>${esc(n.note)}</div>`).join('') || '<p class="mut" style="font-size:.9rem">لا توجد ملاحظات.</p>'}
  <textarea id="ntx" maxlength="1000" placeholder="اكتب ملاحظة عن المتقدم…" style="min-height:70px;margin-top:8px"></textarea><button class="btn navy sm" style="margin-top:8px" data-a="ntadd" data-id="${p.id}">إضافة ملاحظة</button></div>`;
  m.style.display = 'flex';
}

// ===== صفحة المتقدم الذي دُعي للمقابلة =====
const _pp = window.pPending;
window.pPending = function(){
  if (me && me.status === 'interview') {
    main.innerHTML = `<section class="dark ph" style="padding-bottom:90px"><span class="pill">${ic('flask',18)} ${esc(S.club_name)}</span><h1>تمت دعوتك لمقابلة 🎉</h1></section>
    <div class="fcard c"><div style="font-size:3rem">📅</div><p style="margin:12px 0;line-height:2.1;font-weight:700">${me.interview_at ? dt(me.interview_at) : 'سيُحدَّد الموعد قريباً'}</p>
    ${me.interview_place ? `<p style="line-height:2">📍 ${esc(me.interview_place)}</p>` : ''}<p class="mut" style="margin:10px 0 22px;line-height:2">سيتواصل معك أحد المشرفين على رقم جوالك لتأكيد التفاصيل. بعد المقابلة تصلك نتيجة طلبك هنا.</p>

};

// ===== تبويب «المقابلات» للمشرف =====
async function tIv(){
  const ac = document.getElementById('ac'); if (!ac) return;
  ac.innerHTML = '<h1>المقابلات والمتقدمون</h1><p class="sub">تابع كل متقدم: مراجعة، مقابلة، قبول أو رفض، مع ملاحظات داخلية</p><div id="aph"></div>';
  await renderApplicants(document.getElementById('aph'), null);

const _pa = window.pAdmin;
window.pAdmin = function(){
  _pa();
  const rq = document.querySelector('.tabs [data-tab="rq"]');
  if (rq && !document.querySelector('.tabs [data-tab="iv"]')) rq.insertAdjacentHTML('afterend', `<a href="#admin" data-tab="iv" class="${tab === 'iv' ? 'on' : ''}">${ic('usercheck',20)}المقابلات</a>`);

// ===== لوحة رئيس القسم =====
function pHead(){
  main.innerHTML = `<div class="chw" style="max-width:900px"><h2>👔 لوحة رئيس ${esc(cn(me.head_of))}</h2>
  <p class="mut" style="line-height:2;margin:6px 0 14px">ترى هنا طلبات الانضمام وأعضاء قسمك فقط. تحدّد المقابلات، وتقبل أو ترفض المتقدمين، وتكتب ملاحظات يراها المشرفون ورئيس القسم فقط.</p><div id="aph"></div></div>`;
  renderApplicants(document.getElementById('aph'), me.head_of);

  if (location.hash === '#head' && me && me.status === 'approved' && me.head_of) {

// ===== الأزرار والمدخلات =====
document.addEventListener('click', async e => {
  const fb = e.target.closest('[data-apf]'); if (fb) { apF = fb.dataset.apf; return drawAp(); }
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, id = el.dataset.id;
  if (a === 'apopen') { e.preventDefault(); return appModal(id); }
  if (a === 'ivset') {
    const v = document.getElementById('iat').value; if (!v) return toast('اختر موعد المقابلة');
    const {error} = await sb.rpc('set_applicant_status', {p_uid: id, p_status: 'interview', p_at: new Date(v).toISOString(), p_place: document.getElementById('ipl').value.trim()});
    if (error) return toast('تعذّر التنفيذ');
    toast('تم تحديد المقابلة ✓'); await afterChange(); return appModal(id);
  }
  if (a === 'apst') {
    const s = el.dataset.s;
    if (s === 'rejected' && !confirm('رفض هذا الطلب؟')) return;
    const {error} = await sb.rpc('set_applicant_status', {p_uid: id, p_status: s});
    if (error) return toast('تعذّر التنفيذ');
    toast(s === 'approved' ? 'تم قبول المتقدم ✓' : s === 'rejected' ? 'تم رفض الطلب' : 'أُعيد للانتظار');
    document.getElementById('modal').style.display = 'none'; return afterChange();
  }
  if (a === 'ntadd') {
    const t = document.getElementById('ntx').value.trim(); if (!t) return toast('اكتب الملاحظة أولاً');
    const {error} = await sb.from('applicant_notes').insert({applicant_id: id, note: t});
    if (error) return toast('تعذّر حفظ الملاحظة'); return appModal(id);
  }
  if (a === 'ntdel') { e.preventDefault(); if (!confirm('حذف الملاحظة؟')) return; await sb.from('applicant_notes').delete().eq('id', id); return appModal(el.dataset.u); }
  if (a === 'seasq') { const n = +el.dataset.d, now = new Date(); return saveSeason({apply_mode: 'dates', apply_from: now.toISOString(), apply_until: new Date(now.getTime() + n * 864e5).toISOString()}); }

<style>
.tk-todo{background:#fff3d6;color:#92600a}.tk-doing{background:#e0ecff;color:#1d4ed8}.tk-done{background:#d9f5ea;color:#0b7a5c}

<script>
(() => {
const TKS = {todo: 'للتنفيذ', doing: 'قيد التنفيذ', done: 'منجزة'};
const dtt = iso => new Date(iso).toLocaleString('ar-u-nu-latn', {dateStyle: 'medium', timeStyle: 'short'});
const toLocalInput = iso => { if (!iso) return ''; const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const closeX = '<button class="ib" data-a="mx" style="position:absolute;left:14px;top:14px;font-size:1.2rem">✕</button>';
const isLate = t => t.due_at && t.status !== 'done' && new Date(t.due_at) < new Date();
const isMgr = c => !!me && me.status === 'approved' && (me.role === 'admin' || me.head_of === c);
const canMgrAny = () => !!me && me.status === 'approved' && (me.role === 'admin' || !!me.head_of);
const nm = id => esc((MB[id] || {}).full_name || 'عضو');
const byDue = (a, b) => (a.due_at ? new Date(a.due_at).getTime() : 9e15) - (b.due_at ? new Date(b.due_at).getTime() : 9e15);

// ===== عدّاد المهام في القائمة =====
let TKC = {open: 0, late: 0}, tkAt = 0;
async function refreshTk(force){
  if (!me || me.status !== 'approved') { TKC = {open: 0, late: 0}; return; }
  if (!force && Date.now() - tkAt < 60000) return;
  tkAt = Date.now();
  const a = await sb.from('task_assignees').select('task_id').eq('user_id', me.id);
  const ids = (a.data || []).map(x => x.task_id);
  let open = [];
  if (ids.length) { const t = await sb.from('tasks').select('id,status,due_at').in('id', ids); open = (t.data || []).filter(x => x.status !== 'done'); }
  TKC = {open: open.length, late: open.filter(isLate).length}; drawMenu();
}
const _dm = window.drawMenu;
window.drawMenu = function(){
  _dm();
  const m = document.getElementById('menu');
  if (m && me && me.status === 'approved' && !m.querySelector('[href="#tasks"]')) {
    const link = `<a href="#tasks">✅ المهام${TKC.open ? ` (${TKC.open})` : ''}${TKC.late ? ' ⚠️' : ''}</a>`, out = m.querySelector('[data-a="out"]');
    if (out) out.insertAdjacentHTML('beforebegin', link); else m.insertAdjacentHTML('beforeend', link);
  }
};

// ===== بطاقة المهمة =====
let reload = null, TKL = [];
function taskCard(t, mgr){
  const late = isLate(t), st = t.status, as = (t.task_assignees || []).map(x => nm(x.user_id)).join('، ') || '—', lk = safeUrl(t.link);
  const btns = st === 'todo' ? [['doing', '▶ بدء'], ['done', '✔ تم']] : st === 'doing' ? [['done', '✔ تم'], ['todo', '↩ للتنفيذ']] : [['doing', '↩ إعادة فتح']];
  return `<div class="pan tkc" style="padding:16px 18px;${late ? 'border-color:var(--no)' : ''}"><div class="ar"><b>${esc(t.title)}</b><span class="st2 tk-${st}">${TKS[st]}</span></div>
  ${t.details ? `<p class="mut" style="margin:6px 0;line-height:1.9;white-space:pre-wrap">${esc(t.details)}</p>` : ''}
  <div class="mut" style="font-size:.85rem;line-height:2">${esc(cn(t.committee))}${t.due_at ? ` · ⏰ ${dtt(t.due_at)}${late ? ' <b style="color:var(--no)">متأخرة</b>' : ''}` : ''}</div>
  <div class="mut" style="font-size:.85rem;line-height:1.9">👥 ${as}</div>
  <div class="row" style="margin-top:10px">${btns.map(([s, l]) => `<button class="btn ${s === 'done' ? 'ok' : 'line'} sm" data-a="tkst" data-id="${t.id}" data-s="${s}">${l}</button>`).join('')}${lk ? `<a class="btn line sm" href="${lk}" target="_blank" rel="noopener">🔗 الرابط</a>` : ''}
  ${mgr ? `<button class="btn navy sm" data-a="tkedit" data-id="${t.id}">✎ تعديل</button><button class="btn no sm" data-a="tkdel" data-id="${t.id}">🗑</button>` : ''}</div></div>`;
}

// ===== مهامي =====
async function renderMine(el){
  reload = () => renderMine(el);
  const a = await sb.from('task_assignees').select('task_id').eq('user_id', me.id), ids = (a.data || []).map(x => x.task_id);
  let list = [];
  if (ids.length) { const {data} = await sb.from('tasks').select('*, task_assignees(user_id)').in('id', ids); list = data || []; }
  if (!document.body.contains(el)) return;
  TKL = list;
  const late = list.filter(isLate).sort(byDue), doing = list.filter(t => t.status === 'doing' && !isLate(t)).sort(byDue), todo = list.filter(t => t.status === 'todo' && !isLate(t)).sort(byDue);
  const done = list.filter(t => t.status === 'done').sort((x, y) => new Date(y.done_at || 0) - new Date(x.done_at || 0)).slice(0, 10);
  const sec = (title, arr) => arr.length ? `<h3 style="margin:16px 0 8px">${title} (${arr.length})</h3>${arr.map(t => taskCard(t, false)).join('')}` : '';
  el.innerHTML = list.length ? sec('⚠️ متأخرة', late) + sec('قيد التنفيذ', doing) + sec('للتنفيذ', todo) + sec('منجزة مؤخراً', done)
    : '<div class="pan c mut" style="line-height:2.2">لا توجد مهام مسندة إليك الآن 🎉<br>تظهر هنا المهام التي يكلّفك بها رئيس قسمك.</div>';
}

// ===== مهام القسم (لرئيس القسم وللمشرف) =====
let tkF = 'open', tkFixed = null;
async function renderMgr(el, fixed){
  tkFixed = fixed || null; if (fixed) tkC = ''; reload = () => renderMgr(el, fixed);
  const q = sb.from('tasks').select('*, task_assignees(user_id)').order('due_at', {ascending: true});
  const {data, error} = await (fixed ? q.eq('committee', fixed) : q);
  if (!document.body.contains(el)) return;
  if (error) { el.innerHTML = '<div class="pan c mut">تعذّر تحميل المهام. تأكد من تنفيذ كود SQL.</div>'; return; }
  TKL = data || [];
  el.innerHTML = `<div class="ar" style="margin-bottom:10px"><div class="fc" id="tkchips" style="margin:0"></div><button class="btn gold sm" data-a="tknew">＋ مهمة جديدة</button></div>
  ${fixed ? '' : `<select id="tkc" style="margin-bottom:12px"><option value="">كل الأقسام</option>${COMMS.map(c => `<option value="${c.k}" ${tkC === c.k ? 'selected' : ''}>${esc(c.t)}</option>`).join('')}</select>`}<div id="tklist"></div>`;
  drawMgr();
}
let tkC = '';
function drawMgr(){
  const chips = document.getElementById('tkchips'), box = document.getElementById('tklist'); if (!chips || !box) return;
  const base = TKL.filter(t => !tkC || t.committee === tkC);
  const cnt = {open: base.filter(t => t.status !== 'done').length, late: base.filter(isLate).length, done: base.filter(t => t.status === 'done').length, all: base.length};
  chips.innerHTML = [['open', 'مفتوحة'], ['late', 'متأخرة'], ['done', 'منجزة'], ['all', 'الكل']].map(([k, t]) => `<button data-tkf="${k}" class="${tkF === k ? 'on' : ''}">${t} (${cnt[k]})</button>`).join('');
  const l = base.filter(t => tkF === 'all' || (tkF === 'open' && t.status !== 'done') || (tkF === 'late' && isLate(t)) || (tkF === 'done' && t.status === 'done')).sort(byDue);
  box.innerHTML = l.map(t => taskCard(t, true)).join('') || '<div class="pan c mut">لا توجد مهام هنا.</div>';
}

// ===== نافذة إنشاء/تعديل مهمة =====
function assigneeBoxes(c, sel){
  const mem = MBL.filter(p => p.committee === c);
  return mem.length ? mem.map(p => `<label class="pfr" style="display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer"><input type="checkbox" name="as" value="${p.id}" ${sel.includes(p.id) ? 'checked' : ''} style="width:auto"><span>${esc(p.full_name)}</span></label>`).join('')
    : '<p class="mut" style="font-size:.9rem">لا يوجد أعضاء في هذا القسم بعد.</p>';
}
function taskModal(id){
  const t = id ? TKL.find(x => String(x.id) === String(id)) : null;
  const cur = t ? (t.task_assignees || []).map(x => x.user_id) : [];
  const c0 = t ? t.committee : (tkFixed || tkC || (me.head_of || COMMS[0].k));
  const m = document.getElementById('modal');
  m.innerHTML = `<div class="box" style="max-width:560px">${closeX}<h3 style="margin-bottom:6px">${t ? '✎ تعديل المهمة' : '＋ مهمة جديدة'}</h3>
  <form id="tkf"><div class="fl">عنوان المهمة</div><input name="t" required maxlength="120" value="${esc(t ? t.title : '')}">
  <div class="fl">التفاصيل (اختياري)</div><textarea name="d" maxlength="1000" style="min-height:90px">${esc(t ? t.details || '' : '')}</textarea>
  <div class="g2"><div><div class="fl">الموعد النهائي</div><input type="datetime-local" name="due" value="${toLocalInput(t && t.due_at)}"></div><div><div class="fl">رابط (اختياري)</div><input name="l" type="url" placeholder="https://…" value="${esc(t ? t.link || '' : '')}"></div></div>
  ${tkFixed ? `<input type="hidden" name="c" value="${tkFixed}">` : `<div class="fl">القسم</div><select name="c">${COMMS.map(c => `<option value="${c.k}"${c.k === c0 ? ' selected' : ''}>${esc(c.t)}</option>`).join('')}</select>`}
  <div class="fl">المكلَّفون</div><div id="asb" style="max-height:200px;overflow:auto">${assigneeBoxes(tkFixed || c0, cur)}</div>
  <button class="btn navy block" style="margin-top:16px">${t ? 'حفظ التعديلات' : 'إنشاء المهمة'}</button></form></div>`;

    const want = [...f.querySelectorAll('input[name="as"]:checked')].map(x => x.value);

    else { const {data, error} = await sb.from('tasks').insert(row).select().single(); if (error || !data) { b.disabled = false; return toast('تعذّر الحفظ'); } tid = data.id; }
    const had = id ? cur : [], add = want.filter(u => !had.includes(u)), rem = had.filter(u => !want.includes(u));
    for (const u of rem) await sb.from('task_assignees').delete().eq('task_id', tid).eq('user_id', u);
    if (add.length) { const {error} = await sb.from('task_assignees').insert(add.map(u => ({task_id: tid, user_id: u}))); if (error) toast('حُفظت المهمة لكن تعذّر تكليف بعض الأعضاء'); else toast(id ? 'تم التعديل ✓' : 'تم إنشاء المهمة ✓'); }

// ===== صفحة المهام =====
let tkTab = 'mine';
async function pTasks(){

// ===== الأزرار =====
document.addEventListener('click', async e => {
  const tb = e.target.closest('[data-tk]'); if (tb) { e.preventDefault(); tkTab = tb.dataset.tk; return pTasks(); }

// ===== رفع صورة (خلفية بيضاء حتى لا تتحول الشعارات الشفافة إلى سوداء) =====
const toBlob = (file, max) => new Promise((res, rej) => {
  const im = new Image(), u = URL.createObjectURL(file);
  im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(u); c.toBlob(b => b ? res(b) : rej(new Error('img')), 'image/jpeg', .85); };
  im.onerror = () => rej(new Error('img')); im.src = u; });
async function upImg(file, max){
  const blob = await toBlob(file, max), path = `${me.id}/${crypto.randomUUID()}.jpg`;
  const up = await sb.storage.from('media').upload(path, blob, {contentType: 'image/jpeg'});
  if (up.error) throw up.error;
  return sb.storage.from('media').getPublicUrl(path).data.publicUrl;
}

});

<script>
(() => {
const SEATS = [{k: 'president', t: 'رئيس النادي'}, {k: 'vice', t: 'نائب الرئيس'}, {k: 'secretary', t: 'الكاتب العام'}, {k: 'treasurer', t: 'أمين المال'}];
const ST = k => (SEATS.find(s => s.k === k) || {t: ''}).t;
const KINDS = {sponsor: 'الرعاة', partner: 'الشركاء', institution: 'جهات داعمة'};
const KIND1 = {sponsor: 'راعٍ رسمي', partner: 'شريك', institution: 'جهة داعمة'};
const closeX = '<button class="ib" data-a="mx" style="position:absolute;left:14px;top:14px;font-size:1.2rem">✕</button>';
const ok = () => !!me && me.status === 'approved';
const adm = () => ok() && me.role === 'admin';
const isAdm = () => !!me && me.role === 'admin';
const PST = {pending: 'قيد المراجعة', interview: 'مقابلة', rejected: 'مرفوض', banned: 'موقوف', approved: 'مقبول'};
const HORD = ['hr', 'ext', 'design', 'org'];
// رئاسات الأقسام: جدول head_roles (يمكن للعضو رئاسة أكثر من قسم) + العمود القديم head_of للتوافق
let HD = {at: 0, rows: [], err: false}, hdP = null;
function loadHeads(force){
  if (!force && HD.at && Date.now() - HD.at < 60000) return Promise.resolve(HD);
  if (hdP) return hdP;
  hdP = (async () => {
    try { const r = await sb.from('head_roles').select('committee,user_id'); HD.err = !!r.error; if (!r.error) HD.rows = r.data || []; } catch (e) { HD.err = true; }
    HD.at = Date.now(); hdP = null; return HD;
  })();
  return hdP;
}
const myHeads = () => { if (!ok()) return []; const s = new Set(HD.rows.filter(r => r.user_id === me.id).map(r => r.committee)); if (me.head_of) s.add(me.head_of); return HORD.filter(x => s.has(x)); };
const isHead = c => myHeads().includes(c);
const headD = () => isHead('design');
const canDesign = () => ok() && (me.role === 'admin' || isHead('design') || me.committee === 'design');
const canPin = () => adm() || headD();
const canPartners = () => adm() || isHead('ext');
const hero = (icon, pill, h1, sub) => `<section class="dark ph"><span class="pill">${ic(icon, 18)} ${pill}</span><h1>${h1}</h1><p>${sub}</p></section>`;
const fdate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('ar-u-nu-latn', {year: 'numeric', month: 'long', day: 'numeric'}) : '';
const dtt = iso => new Date(iso).toLocaleString('ar-u-nu-latn', {dateStyle: 'medium', timeStyle: 'short'});
const SPH = /^https:\/\/[A-Za-z0-9.-]+\.supabase\.co\/storage\/v1\/object\/public\/(media|avatars)\/[A-Za-z0-9._\/-]+$/;
const okPhoto = u => SPH.test(u || '') ? esc(u) : '';
const nameOf = id => (typeof MB !== 'undefined' && MB && MB[id] && MB[id].full_name) || 'عضو';
const ERR = {'not found or current': 'لا يمكن حذف العهدة الجارية', 'not allowed': 'غير مسموح لك بهذا الإجراء', 'no term': 'لا توجد عهدة جارية — ابدأ عهدة أولاً', 'term exists': 'توجد عهدة جارية بالفعل',
  'not an approved member': 'هذا الحساب ليس عضواً مقبولاً', 'bad title': 'اكتب عنواناً من حرفين إلى 40 حرفاً',
  'rate limit': 'أرسلت عدة رسائل مؤخراً، حاول بعد قليل', 'no office': 'لا يوجد أعضاء في المكتب حالياً', 'bad text': 'اكتب رسالة من حرفين إلى 1000 حرف',
  'no names': 'اكتب اسماً واحداً على الأقل', 'bad dept': 'قسم غير معروف', 'bad seat': 'مقعد غير معروف', 'bad name': 'كل اسم بين حرفين و80 حرفاً', 'not found': 'العنصر غير موجود'};
const emsg = (e, d) => { const m = (e && e.message) || ''; for (const k in ERR) if (m.includes(k)) return ERR[k];
  if (/does not exist|schema cache|Could not find/i.test(m)) return 'نفّذ كود SQL الخاص بالدفعة الرابعة أولاً'; return d || 'تعذّر التنفيذ'; };
const box = html => { const m = $('#modal'); m.innerHTML = `<div class="box">${closeX}${html}</div>`; m.style.display = 'flex'; return m; };

// ===== رفع صورة (خلفية بيضاء حتى لا تتحول الشعارات الشفافة إلى سوداء) =====
const toBlob = (file, max) => new Promise((res, rej) => {
  const im = new Image(), u = URL.createObjectURL(file);
  im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(u); c.toBlob(b => b ? res(b) : rej(new Error('img')), 'image/jpeg', .85); };
  im.onerror = () => rej(new Error('img')); im.src = u; });
async function upImg(file, max){
  const blob = await toBlob(file, max), path = `${me.id}/${crypto.randomUUID()}.jpg`;
  const up = await sb.storage.from('media').upload(path, blob, {contentType: 'image/jpeg'});
  if (up.error) throw up.error;
  return sb.storage.from('media').getPublicUrl(path).data.publicUrl;
}

// ===== بيانات المكتب =====
let OF = {at: 0, terms: [], seats: [], err: false}, ofP = null;
function loadOffice(force){
  if (!force && OF.at && Date.now() - OF.at < 60000) return Promise.resolve(OF);
  if (ofP) return ofP;
  ofP = (async () => {
    try {
      const [t, s] = await Promise.all([sb.from('office_terms').select('*').order('id', {ascending: false}), sb.from('office_seats').select('*').order('id', {ascending: true})]);
      OF.err = !!(t.error || s.error);
      if (!OF.err) { OF.terms = t.data || []; OF.seats = s.data || []; }
    } catch (e) { OF.err = true; }
    OF.at = Date.now(); ofP = null; return OF;
  })();
  return ofP;
}
const cur = () => OF.terms.find(t => !t.ended_at) || null;
const seatRow = (tid, k) => OF.seats.find(s => s.term_id === tid && s.seat === k) || null;
const SORD = SEATS.map(s => s.k);
const seatsOf = id => { const c = cur(); if (!c || !id) return []; const set = new Set(OF.seats.filter(x => x.term_id === c.id && x.user_id === id).map(x => x.seat)); return SORD.filter(k => set.has(k)); };
const mySeats = () => ok() ? seatsOf(me.id) : [];
const isLead = () => mySeats().some(k => k === 'president' || k === 'vice');

// ===== الشارات بجانب الأسماء (الملف، التعليقات، المحادثات، قائمة الأعضاء) =====
function paintBadges(){
  const c = cur(); if (!c) return;
  const map = {}; SORD.forEach(k => OF.seats.forEach(s => { if (s.term_id === c.id && s.user_id && s.seat === k) (map[s.user_id] = map[s.user_id] || []).push(k); }));
  if (!Object.keys(map).length) return;
  document.querySelectorAll('#main a[href^="#u/"]').forEach(a => {
    if (a.dataset.ofb) return; a.dataset.ofb = '1';
    const k = map[a.getAttribute('href').slice(3)]; if (!k) return;
    const cl = a.cloneNode(true); cl.querySelectorAll('.ava,img,svg').forEach(x => x.remove());
    if (!cl.textContent.trim()) return;
    const tag = k.map(x => `<span class="ofb">${esc(ST(x))}</span>`).join(''), b = a.querySelector('b');
    if (b) b.insertAdjacentHTML('afterend', tag); else a.insertAdjacentHTML('afterend', tag);
  });
  if (view === 'u') {
    const h = document.querySelector('#main .pc h1'), id = (location.hash.split('/')[1] || '');
    if (h && !h.dataset.ofb) { h.dataset.ofb = '1'; if (map[id]) h.insertAdjacentHTML('afterend', `<div>${map[id].map(x => `<span class="ofb big">${esc(ST(x))}</span>`).join('')}</div>`); }
  }
}
let paintQ = false;
function schedulePaint(){ if (paintQ) return; paintQ = true; requestAnimationFrame(() => { paintQ = false; try { paintBadges(); } catch (e) {} }); }
try { new MutationObserver(schedulePaint).observe(main, {childList: true, subtree: true}); } catch (e) {}
let menuFor = null;
function kick(){
  if (!ok()) return;
  Promise.all([loadOffice(), loadHeads()]).then(() => { schedulePaint(); const k = mySeats().join(',') + '|' + myHeads().join(','); if (menuFor !== k) { menuFor = k; try { drawMenu(); } catch (e) {} } });
}

// ===== صفحة فريقنا: المكتب + الشركاء =====
let PT = [];
const ptCard = p => { const u = safeUrl(p.url), logo = okImg(p.logo_url);
  const inner = `${logo ? `<img class="pti" src="${logo}" alt="" loading="lazy">` : `<span class="ptn">${esc(ini(p.name))}</span>`}<b>${esc(p.name)}</b>`;
  return `<div class="ptw">${u ? `<a class="ptc" href="${u}" target="_blank" rel="noopener noreferrer">${inner}</a>` : `<div class="ptc">${inner}</div>`}
  ${canPartners() ? `<div class="row"><button class="btn line sm" data-a="b4ptedit" data-id="${p.id}">✎</button><button class="btn no sm" data-a="b4ptdel" data-id="${p.id}">🗑</button></div>` : ''}</div>`; };
function drawPartners(){
  const el = $('#ptl'); if (!el) return;
  const html = Object.keys(KINDS).map(k => { const l = PT.filter(p => p.kind === k); return l.length ? `<h3 style="margin:18px 0 10px">${KINDS[k]}</h3><div class="ptg">${l.map(ptCard).join('')}</div>` : ''; }).join('');
  el.innerHTML = html || '<p class="mut c" style="padding:20px">لا يوجد شركاء معلنون بعد.</p>';
}
async function loadPartners(){
  const p = await sb.from('partners').select('*').order('sort', {ascending: true}).order('id', {ascending: true});
  if (!$('#ptl')) return;
  if (p.error) { $('#ptl').innerHTML = '<p class="mut c" style="padding:20px">تعذّر تحميل الشركاء. تأكد من تنفيذ كود SQL الخاص بالدفعة الثالثة.</p>'; return; }
  PT = p.data || []; drawPartners();
}
function seatCard(c, k){
  const s = seatRow(c.id, k), title = ST(k);
  if (!s) {
    if (k === 'treasurer' && !adm()) return '';
    return `<div class="ofc vac"><span class="ofp">؟</span><b class="ofn">شاغر</b><span class="ofs">${title}</span>${k === 'treasurer' ? '<small class="mut">مقعد اختياري</small>' : ''}
    ${adm() ? `<div class="row"><button class="btn gold sm" data-a="b4seat" data-k="${k}">${k === 'treasurer' ? 'تفعيل المقعد' : 'تعيين'}</button></div>` : ''}</div>`;
  }
  const ph = okPhoto(s.photo_url);
  const img = ph ? `<img class="ofp" src="${ph}" alt="" loading="lazy">` : `<span class="ofp">${esc(ini(s.full_name))}</span>`;
  const nm = ok() && s.user_id ? `<a class="ofn" data-ofb="1" href="#u/${esc(s.user_id)}">${esc(s.full_name)}</a>` : `<b class="ofn">${esc(s.full_name)}</b>`;
  return `<div class="ofc">${img}${nm}<span class="ofs">${title}</span>
  ${adm() ? `<div class="row"><button class="btn line sm" data-a="b4seat" data-k="${k}">تغيير</button><button class="btn no sm" data-a="b4vac" data-k="${k}">إخلاء</button></div>` : ''}</div>`;
}
let ofaOpen = false;
function archiveHTML(){
  const old = OF.terms.filter(t => t.ended_at).sort((a, b) => (new Date(b.ended_at) - new Date(a.ended_at)) || (b.id - a.id));
  if (!old.length && !adm()) return '';
  return `<details class="ofa"${ofaOpen ? ' open' : ''}><summary>📜 أرشيف المكاتب السابقة (${old.length})</summary>
  ${old.map(t => { const list = SEATS.map(s => { const r = seatRow(t.id, s.k); return r ? `<span><small>${s.t}</small> ${esc(r.full_name)}</span>` : ''; }).join('');
    return `<div class="ofo"><div class="ar"><b>${esc(t.title)}</b>${adm() ? `<button class="btn no sm" data-a="b4del" data-id="${t.id}">🗑</button>` : ''}</div><div class="ofl">${list || '<small class="mut">لا أسماء</small>'}</div></div>`; }).join('') || '<p class="mut" style="padding:8px 0">لا توجد مكاتب سابقة بعد.</p>'}
  ${adm() ? '<button class="btn line sm" data-a="b4arc" style="margin-top:10px">＋ إضافة مكتب سابق</button>' : ''}</details>`;
}
function drawOffice(){
  drawOffice0();
  const el = $('#ofx');
  if (el && isAdm() && !ok()) el.insertAdjacentHTML('afterbegin', '<div class="pan"><b>حسابك كمشرف غير مقبول رسمياً</b><p class="mut" style="line-height:1.9;margin:6px 0 10px">لذلك لا تظهر أزرار تعيين المكتب. افتح «المناصب» واعتمد حسابك أولاً.</p><a class="btn gold sm" href="#roles">فتح المناصب</a></div>');
}
function drawOffice0(){
  const el = $('#ofx'); if (!el) return;
  if (OF.err) { el.innerHTML = '<p class="mut c" style="padding:20px">تعذّر تحميل المكتب. تأكد من تنفيذ كود SQL الخاص بالدفعة الرابعة.</p>'; return; }
  const c = cur();
  if (!c) {
    el.innerHTML = (adm() ? '<div class="pan c"><p class="mut" style="margin-bottom:12px">لم تبدأ أي عهدة بعد.</p><button class="btn gold" data-a="b4start">＋ بدء العهدة الأولى</button></div>'
      : '<p class="mut c" style="padding:20px">سيُعلن عن أعضاء المكتب قريباً.</p>') + archiveHTML();
    return;
  }
  const holders = OF.seats.some(s => s.term_id === c.id && s.user_id);
  const acts = [];
  if (ok() && holders) acts.push('<button class="btn gold" data-a="b4contact">📨 راسل المكتب</button>');
  else if (!me && holders) acts.push('<a class="btn line" href="#login">سجّل الدخول لمراسلة المكتب</a>');

<script>
(() => {
// ================= الدورات: دروس مصوّرة + لقاءات مباشرة/حضورية + شهادات =================
const ok = () => !!me && me.status === 'approved';
const isAdm = () => !!me && me.role === 'admin';
const pad = n => String(n).padStart(2, '0');
const fdur = s => { s = Math.max(0, Math.round(+s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`; };
const dtt = iso => new Date(iso).toLocaleString('ar-u-nu-latn', {dateStyle: 'medium', timeStyle: 'short'});
const dday = iso => new Date(iso).toLocaleDateString('ar-u-nu-latn', {year: 'numeric', month: 'long', day: 'numeric'});
const toLocalInput = iso => { const d = new Date(iso); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const closeX = '<button class="ib" data-a="mx" style="position:absolute;left:14px;top:14px;font-size:1.2rem">✕</button>';
const box5 = html => { const m = $('#modal'); m.innerHTML = `<div class="box">${closeX}${html}</div>`; m.style.display = 'flex'; return m; };
const hero5 = (icon, pill, h1, sub) => `<section class="dark ph"><span class="pill">${ic(icon, 18)} ${pill}</span><h1>${h1}</h1><p>${sub}</p></section>`;
// ---- رفع صورة (خلفية بيضاء، JPEG، حتى 1280px) إلى مجلد العضو في الحاوية media ----
const toBlob = (file, max) => new Promise((res, rej) => {
  const im = new Image(), u = URL.createObjectURL(file);
  im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(u); c.toBlob(b => b ? res(b) : rej(new Error('img')), 'image/jpeg', .85); };
  im.onerror = () => rej(new Error('img')); im.src = u; });
async function upImg(file, max){
  const blob = await toBlob(file, max), path = `${me.id}/${crypto.randomUUID()}.jpg`;
  const up = await sb.storage.from('media').upload(path, blob, {contentType: 'image/jpeg'});
  if (up.error) throw up.error;
  return sb.storage.from('media').getPublicUrl(path).data.publicUrl;
}
const verifyUrl = code => location.origin + location.pathname + '#verify/' + code;
const need85 = l => Math.ceil(l.duration_secs * 0.85);

// ---- روابط يوتيوب ----
function ytId(u){
  u = String(u || '').trim(); if (!u) return null;
  if (/^[A-Za-z0-9_-]{11}$/.test(u)) return u;
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  let m = null;
  try {
    const x = new URL(u), h = x.hostname.replace(/^(www|m)\./, '');
    if (h === 'youtu.be') m = x.pathname.slice(1).split('/')[0];
    else if (/(^|\.)youtube(-nocookie)?\.com$/.test(h)) {
      m = x.searchParams.get('v');
      if (!m) { const p = x.pathname.split('/').filter(Boolean); if (['embed', 'live', 'shorts', 'v'].includes(p[0])) m = p[1]; }
    }
  } catch (e) {}
  return m && /^[A-Za-z0-9_-]{11}$/.test(m) ? m : null;
}
function parseDur(t){
  t = String(t || '').trim(); if (!t) return 0;
  if (/^\d+$/.test(t)) return +t * 60;
  const p = t.split(':').map(Number);
  if (p.length > 3 || p.some(x => !isFinite(x) || x < 0)) return 0;
  return p.reduce((a, x) => a * 60 + x, 0);
}

// ---- رسائل الأخطاء ----
const E5 = {'not enrolled': 'سجّل في الدورة أولاً', 'course full': 'اكتمل عدد المقاعد', 'not allowed': 'غير مسموح لك بهذا الإجراء',
  'not found': 'العنصر غير موجود (ربما حُذف أو لم يُنشر)', 'outside window': 'البث غير متاح الآن (يفتح قبل الموعد بربع ساعة)',
  'not live': 'هذا اللقاء حضوري — استخدم رمز الحضور', 'bad minutes': 'المدة بين 1 و600 دقيقة', 'not an approved member': 'هذا الحساب ليس عضواً مقبولاً',
  'row-level security': 'غير مسموح لك بهذا الإجراء', 'check constraint': 'تحقّق من الحقول: العنوان 3 أحرف فأكثر، والسعة رقم موجب، والروابط صحيحة',
  'permission denied': 'غير مسموح لك بهذا الإجراء'};
const emsg = (e, d) => {
  const m = (e && e.message) || '';
  if (/does not exist|schema cache|Could not find/i.test(m)) return 'نفّذ كود SQL الخاص بالدفعة الخامسة أولاً';
  for (const k in E5) if (m.includes(k)) return E5[k];
  return d === undefined ? 'تعذّر التنفيذ' : d;
};

// ---- الصلاحيات ----
let PM = {all: false, heads: [], at: 0, uid: null};
async function loadPerms(){
  if (!ok()) { PM = {all: false, heads: [], at: Date.now(), uid: null}; return PM; }
  if (PM.at && PM.uid === me.id && Date.now() - PM.at < 60000) return PM;
  try { const {data, error} = await sb.rpc('course_perms'); if (!error && data) PM = {all: !!data.all, heads: data.heads || [], at: Date.now(), uid: me.id}; } catch (e) {}
  return PM;
}
const canMake = () => ok() && (PM.all || PM.heads.length > 0);
const canMgr = c => ok() && !!c && (PM.all || PM.heads.includes(c.committee));
const depts = () => PM.all ? ['hr', 'ext', 'design', 'org'] : PM.heads.slice();

// ---- يوتيوب ----
let ytP = null;
function loadYT(){
  if (window.YT && window.YT.Player) return Promise.resolve(window.YT);
  if (ytP) return ytP;
  ytP = new Promise((res, rej) => {
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { try { prev && prev(); } catch (e) {} res(window.YT); };
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.onerror = () => { ytP = null; rej(new Error('yt')); };
    document.head.appendChild(s);
    setTimeout(() => { if (!(window.YT && window.YT.Player)) { ytP = null; rej(new Error('yt timeout')); } }, 12000);
  });
  return ytP;
}
async function ytDuration(id){
  const YT = await loadYT();
  return new Promise((res, rej) => {
    const host = document.createElement('div'); host.style.cssText = 'position:fixed;left:-9999px;top:0;width:200px;height:120px;overflow:hidden';
    const el = document.createElement('div'); host.appendChild(el); document.body.appendChild(host);
    let done = false, p = null, tries = 0;
    const fin = (v, e) => { if (done) return; done = true; try { p && p.destroy(); } catch (x) {} host.remove(); e ? rej(e) : res(v); };
    const poll = () => { let d = 0; try { d = Math.round(p.getDuration()); } catch (x) {} if (d > 0) return fin(d); if (++tries > 8) return fin(0, new Error('no duration')); setTimeout(poll, 600); };
    p = new YT.Player(el, {videoId: id, width: 200, height: 120, events: {onReady: poll, onError: () => fin(0, new Error('err'))}});
    setTimeout(() => fin(0, new Error('timeout')), 12000);
  });
}
const plainFrame = id => `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?rel=0&playsinline=1" allow="accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy" title="فيديو"></iframe>`;

// ---- حالة الصفحة ----
let RT = 0, CL = {courses: [], counts: {}, mine: new Set(), certs: [], err: null}, F5 = {t: 'all', q: ''}, CS = null, PL = null;

// =============== قائمة الدورات ===============
async function loadList(){
  const calls = [sb.from('courses').select('*').order('created_at', {ascending: false}), sb.rpc('course_counts')];
  if (ok()) calls.push(sb.from('course_enrollments').select('course_id').eq('user_id', me.id), sb.from('course_certificates').select('*').eq('user_id', me.id).order('issued_at', {ascending: false}));
  let r; try { r = await Promise.all(calls); } catch (e) { CL.err = e; return false; }
  if (r[0].error) { CL.err = r[0].error; return false; }
  CL.err = null; CL.courses = r[0].data || [];
  CL.counts = {}; (r[1].data || []).forEach(x => CL.counts[x.course_id] = x);
  CL.mine = new Set(ok() && r[2] && !r[2].error ? (r[2].data || []).map(x => x.course_id) : []);
  CL.certs = ok() && r[3] && !r[3].error ? (r[3].data || []) : [];
  return true;
}
async function pCourses(){
  const t = ++RT;
  if (F5.uid !== (me ? me.id : null)) F5 = {t: 'all', q: '', uid: me ? me.id : null};
  main.innerHTML = hero5('graduation', 'الدورات والشهادات', 'دورات النادي', 'دروس مصوّرة ولقاءات مباشرة وحضورية — أكمل الدروس واحضر اللقاءات لتحصل على شهادتك.') +
    `<div class="sec b5" style="padding-top:30px"><div id="b5top"></div><div id="b5list">${loader}</div></div>`;
  const [good] = await Promise.all([loadList(), loadPerms()]);
  if (t !== RT || !$('#b5list')) return;
  if (!good) { $('#b5list').innerHTML = `<div class="pan c"><p class="mut" style="margin:0">${esc(emsg(CL.err, 'تعذّر تحميل الدورات'))}</p></div>`; return; }

}
function drawList(){
  const top = $('#b5top'), box = $('#b5list'); if (!top || !box) return;
  const tabs = [['all', 'كل الدورات']]; if (ok()) tabs.push(['mine', 'دوراتي'], ['certs', 'شهاداتي' + (CL.certs.length ? ` (${CL.certs.length})` : '')]);
  const drafts = canMake() && CL.courses.some(c => !c.published); if (drafts) tabs.push(['draft', 'المسودات']);
  if (!tabs.some(x => x[0] === F5.t)) F5.t = 'all';
  top.innerHTML = `<div class="ar" style="margin-bottom:10px;flex-wrap:wrap"><div class="fc" style="margin:0">${tabs.map(([k, v]) => `<button data-a="b5tab" data-v="${k}" class="${F5.t === k ? 'on' : ''}">${v}</button>`).join('')}</div>
    ${canMake() ? '<button class="btn gold sm" data-a="b5new">＋ دورة جديدة</button>' : ''}</div>
    ${F5.t !== 'certs' ? `<div class="sr"><input id="b5q" placeholder="ابحث عن دورة…" value="${esc(F5.q)}" autocomplete="off">${ic('search', 20)}</div>` : ''}
    <p class="note" style="margin:0 0 12px"><a href="#verify" style="text-decoration:underline">التحقق من صحة شهادة</a></p>`;
  const qi = $('#b5q'); if (qi) qi.oninput = () => { F5.q = qi.value; drawCards(); };
  drawCards();
}
function drawCards(){
  const box = $('#b5list'); if (!box) return;
  if (F5.t === 'certs') { box.innerHTML = CL.certs.length ? `<div class="b5g">${CL.certs.map(certCard).join('')}</div>` : '<div class="pan c"><p class="mut" style="margin:0">لا شهادات بعد — أكمل دروس دورة واحضر لقاءاتها لتحصل على أول شهادة.</p></div>'; return; }

async function loadCourse(id){

  if (!r.data) return {nf: true};
  const c = r.data, S = {c, lessons: [], sessions: [], enrolled: false, prog: {}, att: {}, cert: null, codes: {}, count: 0};
  const q = [sb.rpc('course_counts')];
  if (ok()) q.push(
    sb.from('course_lessons').select('*').eq('course_id', c.id).order('position', {ascending: true}).order('id', {ascending: true}),
    sb.from('course_sessions').select('*').eq('course_id', c.id).order('starts_at', {ascending: true}),
    sb.from('course_enrollments').select('course_id').eq('course_id', c.id).eq('user_id', me.id).maybeSingle(),
    sb.from('course_lesson_progress').select('lesson_id,covered,completed_at,manual').eq('course_id', c.id).eq('user_id', me.id),
    sb.from('course_attendance').select('session_id,secs,attended_at,method').eq('course_id', c.id).eq('user_id', me.id),
    sb.from('course_certificates').select('*').eq('course_id', c.id).eq('user_id', me.id).maybeSingle());
  if (canMgr(c)) q.push(sb.from('course_session_codes').select('*'));
  let x; try { x = await Promise.all(q); } catch (e) { return {err: e}; }
  const cnt = (x[0].data || []).find(y => y.course_id === c.id); S.count = cnt ? +cnt.enrolled : 0; S.nL = cnt ? +cnt.lessons : 0; S.nS = cnt ? +cnt.sessions : 0;
  if (ok()) {
    S.lessons = x[1].data || []; S.sessions = x[2].data || []; S.enrolled = !!x[3].data;
    (x[4].data || []).forEach(p => S.prog[p.lesson_id] = p); (x[5].data || []).forEach(a => S.att[a.session_id] = a);
    S.cert = x[6].data || null;

  }
  return S;
}

function wrapLines(x, text, maxW){

  if (cur) out.push(cur); return out;
}
