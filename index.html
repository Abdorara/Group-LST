  x.fillStyle = '#334155'; font(38); x.fillText('تشهد إدارة النادي بأن', W / 2, 562);

  x.strokeStyle = '#d4a72c'; x.lineWidth = 2; x.beginPath(); x.moveTo(W / 2 - 340, 722); x.lineTo(W / 2 + 340, 722); x.stroke();
  x.fillStyle = '#334155'; font(38); x.fillText('قد أتمّ بنجاح جميع متطلبات', W / 2, 786);

const GSVG = '<svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';
const here = () => location.origin + location.pathname;
const setIntent = v => { try { localStorage.setItem(KEY, v + ':' + Date.now()); } catch (e) {} };
const clearIntent = () => { try { localStorage.removeItem(KEY); } catch (e) {} };
const getIntent = () => { try { const v = localStorage.getItem(KEY); if (!v) return null; const [k, t] = v.split(':'); if (Date.now() - (+t || 0) > 180000) { localStorage.removeItem(KEY); return null; } return k; } catch (e) { return null; } };
// خطأ عائد من جوجل/سوبابيس (يقرأ من العنوان قبل أن تنظّفه المكتبة إن أمكن)
const URLERR = (() => { try { const s = ('&' + location.hash.slice(1) + '&' + location.search.slice(1)); const m = /[&?]error_description=([^&]+)/.exec(s); return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : null; } catch (e) { return null; } })();
function gmsg(m){
  m = String(m || '');
  if (/already linked|already exists|identity_already_exists/i.test(m)) return 'حساب جوجل هذا مرتبط بعضو آخر';
  if (/Database error saving new user|google_not_linked/i.test(m)) return 'حساب جوجل هذا غير مرتبط بأي عضو. ادخل برقمك الجامعي ثم اربطه من «ملفي الشخصي»';
  if (/manual linking/i.test(m)) return 'فعّل خيار Allow manual linking في إعدادات Supabase';
  if (/provider is not enabled|unsupported provider/i.test(m)) return 'فعّل مزوّد Google في إعدادات Supabase أولاً';
  if (/access_denied|cancel/i.test(m)) return 'أُلغيت العملية';
  return 'تعذّر إكمال العملية مع جوجل';
}
async function gLogin(btn){
  setIntent('login'); btn.disabled = true;
  let r; try { r = await sb.auth.signInWithOAuth({provider: 'google', options: {redirectTo: here(), queryParams: {prompt: 'select_account'}}}); } catch (e) { r = {error: e}; }
  if (r && r.error) { clearIntent(); btn.disabled = false; toast(gmsg(r.error.message)); }
}
async function gLink(btn){
  setIntent('link'); btn.disabled = true;
  let r; try { r = await sb.auth.linkIdentity({provider: 'google', options: {redirectTo: here(), queryParams: {prompt: 'select_account'}}}); } catch (e) { r = {error: e}; }
  if (r && r.error) { clearIntent(); btn.disabled = false; toast(gmsg(r.error.message)); }
}
let GID = null;
async function identities(){
  try { const {data, error} = await sb.auth.getUserIdentities(); if (error || !data) return null; return data.identities || []; } catch (e) { return null; }
}
async function fillCard(){
  if (!document.getElementById('g6st')) return;
  const ids = await identities(), el = document.getElementById('g6st'); if (!el) return;
  if (!ids) { el.innerHTML = '<p class="note" style="margin:0">تعذّرت قراءة حالة الربط</p>'; return; }
  GID = ids.find(i => i.provider === 'google') || null;
  el.innerHTML = GID
    ? `<div class="g6ok">✓ مرتبط بحساب جوجل: <b dir="ltr">${esc((GID.identity_data && GID.identity_data.email) || '')}</b></div><button type="button" class="btn line block" data-a="g6unlink">فك الربط</button>`
    : `<button type="button" class="btn line block g6b" data-a="g6link">${GSVG}<span>ربط حساب جوجل</span></button>`;
}
function inject(){
  if (me) {
    const pwf = document.getElementById('pwf');
    if (pwf && !document.getElementById('g6card')) {
      pwf.insertAdjacentHTML('afterend', `<div class="fcard fc2" id="g6card"><div class="fl" style="margin-top:0">${ic('key', 20)}الدخول بحساب جوجل</div>
        <p class="note">اربط حساب جوجل مرة واحدة لتدخل لاحقاً بضغطة واحدة. يبقى الدخول بالرقم الجامعي وكلمة المرور يعمل دائماً.</p><div id="g6st"><p class="note" style="margin:0">جارٍ التحميل…</p></div></div>`);
      fillCard();
    }
  } else {
    const lf = document.getElementById('lf');
    if (lf && !document.getElementById('g6lb')) {
      const b = lf.querySelector('button.gold') || lf.querySelector('button'); if (!b) return;
      b.insertAdjacentHTML('afterend', `<div class="g6sep" id="g6lb">أو</div><button type="button" class="btn line block g6b" data-a="g6login">${GSVG}<span>الدخول بحساب جوجل</span></button><p class="note c" style="margin:10px 0 0">يعمل بعد ربط حسابك مرة واحدة من «ملفي الشخصي».</p>`);
    }
  }
}
let tm = 0;
const main_ = document.getElementById('main');
const kick = () => { if (!tm) tm = setTimeout(() => { tm = 0; try { inject(); } catch (e) { console.error(e); } }, 30); };
if (main_) new MutationObserver(kick).observe(main_, {childList: true, subtree: true});
kick();

// ---- العودة من جوجل (تُعالَج مرة واحدة عند تحميل الصفحة، دون الاعتماد على ترتيب أول رسم) ----
(async () => {
  const it = getIntent(); if (!it) return;
  clearIntent();
  try {
    const {data: {session}} = await sb.auth.getSession();
    if (it === 'login') {
      if (!session) { toast(URLERR ? gmsg(URLERR) : 'لم يكتمل الدخول بجوجل. إن لم يكن حسابك مرتبطاً فادخل برقمك الجامعي ثم اربطه من «ملفي الشخصي»'); if (location.hash !== '#login') nav('#login'); }
    } else if (it === 'link' && session) {
      const ids = await identities(), ok = !!(ids && ids.some(i => i.provider === 'google'));
      toast(ok ? 'تم ربط حساب جوجل ✓' : (URLERR ? gmsg(URLERR) : 'لم يتم ربط حساب جوجل'));
      if (location.hash !== '#me') nav('#me');
    }
  } catch (e) {}
})();
window.addEventListener('pageshow', e => { if (e.persisted) clearIntent(); });

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a;
  if (a === 'g6login') return gLogin(el);
  if (a === 'g6link') return gLink(el);
  if (a === 'g6unlink') {
    if (!GID || !confirm('فك ربط حساب جوجل؟ يمكنك الدخول بالرقم الجامعي دائماً.')) return;
    el.disabled = true;
    let r; try { r = await sb.auth.unlinkIdentity(GID); } catch (x) { r = {error: x}; }
    if (r && r.error) { el.disabled = false; return toast(gmsg(r.error.message)); }
    toast('تم فك الربط'); return fillCard();
  }
});
})();

  if (f.indexOf('{s}') >= 0) { const m = /(\d+)[\s ]*$/.exec(before); f = f.split('{s}').join(m && +m[1] > 1 ? 's' : ''); }

{

const L = FR
  ? {on: 'En ligne', off: 'Hors ligne', title: 'Statut de connexion', note: 'Les membres voient un point vert à côté de votre nom quand vous êtes connecté. Si vous le masquez, vous ne verrez pas non plus le statut des autres.', show: 'Afficher mon statut', t1: 'Statut affiché', t0: 'Statut masqué'}
  : {on: 'متصل الآن', off: 'غير متصل', title: 'حالة الاتصال', note: 'يرى الأعضاء نقطة خضراء بجانب اسمك وأنت متصل بالموقع. إن أخفيتها فلن تظهر حالتك ولن ترى حالة الآخرين.', show: 'إظهار حالة الاتصال', t1: 'تم إظهار حالتك', t0: 'تم إخفاء حالتك'};
const HID = 'lst_hide_online', CHN = 'lst-online-v1';
const hidden = () => { try { return localStorage.getItem(HID) === '1'; } catch (e) { return false; } };
let ch = null, ONLINE = new Set();

function paint(){
  document.querySelectorAll('.pdw[data-uid]').forEach(w => w.classList.toggle('on', !!ch && ONLINE.has(w.dataset.uid)));
  document.querySelectorAll('[data-pst][data-uid]').forEach(e => {
    const on = !!ch && ONLINE.has(e.dataset.uid);
    e.style.display = ch ? '' : 'none'; e.classList.toggle('on', on); e.textContent = on ? L.on : L.off;
  });
}
function start(){
  if (ch || hidden() || typeof me === 'undefined' || !me || me.status !== 'approved' || typeof sb === 'undefined' || !sb.channel) return;
  let c;
  try {
    c = sb.channel(CHN, {config: {presence: {key: me.id}}});
    c.on('presence', {event: 'sync'}, () => { if (ch !== c) return; try { ONLINE = new Set(Object.keys(c.presenceState())); } catch (e) {} kick(); });
    ch = c;
    c.subscribe(st => { if (ch === c && st === 'SUBSCRIBED' && !document.hidden) { try { c.track({t: Date.now()}); } catch (e) {} } });
  } catch (e) { console.error(e); ch = null; }
}
function stop(){
  if (ch) { const c = ch; ch = null; try { sb.removeChannel(c); } catch (e) {} }
  ONLINE = new Set(); paint();
}
const uidOf = h => { const m = /^#(?:u|dm)\/([0-9A-Za-z-]+)/.exec(h || ''); return m ? m[1] : null; };
function wrap(v, uid){
  if (!v || !v.parentNode || v.parentNode.classList.contains('pdw')) return;
  const w = document.createElement('span'); w.className = 'pdw'; w.dataset.uid = uid;
  v.parentNode.insertBefore(w, v); w.appendChild(v);
  const d = document.createElement('i'); d.className = 'pdt'; w.appendChild(d);
}
function decorate(){
  const m = document.getElementById('main'); if (!m) return;
  if (!ch) { paint(); return; }
  m.querySelectorAll('a[href^="#u/"], a[href^="#dm/"]').forEach(a => { const id = uidOf(a.getAttribute('href')); if (id) a.querySelectorAll('.ava').forEach(v => wrap(v, id)); });
  const hm = /^#u\/([0-9A-Za-z-]+)/.exec(location.hash);
  if (hm) {
    const pa = m.querySelector('.pf .pa');
    if (pa) {
      pa.querySelectorAll('.ava').forEach(v => wrap(v, hm[1]));
      const h1 = m.querySelector('.pf .pc h1');
      if (h1 && !m.querySelector('.pf [data-pst]')) h1.insertAdjacentHTML('afterend', '<div class="pst7" data-pst data-uid="' + hm[1] + '" data-nofr="1"></div>');
    }
  }
  m.querySelectorAll('.dh a.who[href^="#u/"]').forEach(a => {
    const id = uidOf(a.getAttribute('href')), sm = a.querySelector('small');
    if (id && sm && !a.querySelector('[data-pst]')) sm.insertAdjacentHTML('afterend', '<small class="pst7" data-pst data-uid="' + id + '" data-nofr="1" style="display:block"></small>');
  });
  paint();
}
function inject(){
  const pwf = document.getElementById('pwf');
  if (pwf && !document.getElementById('p7card'))
    pwf.insertAdjacentHTML('beforebegin', '<div class="fcard fc2" id="p7card" data-nofr="1"><div class="fl" style="margin-top:0">🟢 ' + L.title + '</div><p class="note" style="margin:0 0 12px">' + L.note + '</p><label class="p7row"><input type="checkbox" id="p7chk"' + (hidden() ? '' : ' checked') + '> ' + L.show + '</label></div>');
}
let tm = 0;
const kick = () => { if (!tm) tm = setTimeout(() => { tm = 0; try { if (!ch) start(); inject(); decorate(); } catch (e) { console.error(e); } }, 30); };
const main_ = document.getElementById('main');
if (main_) new MutationObserver(kick).observe(main_, {childList: true, subtree: true});

const _s = window.startRT; if (typeof _s === 'function') window.startRT = function(){ const r = _s.apply(this, arguments); start(); return r; };
const _t = window.stopRT; if (typeof _t === 'function') window.stopRT = function(){ stop(); return _t.apply(this, arguments); };

document.addEventListener('change', e => {
  if (!e.target || e.target.id !== 'p7chk') return;
  const show = e.target.checked;
  try { localStorage.setItem(HID, show ? '0' : '1'); } catch (x) {}
  if (show) start(); else stop();
  kick(); toast(show ? L.t1 : L.t0);
});
document.addEventListener('visibilitychange', () => { if (!ch) return; try { document.hidden ? ch.untrack() : ch.track({t: Date.now()}); } catch (e) {} });
window.addEventListener('pagehide', () => { try { if (ch) ch.untrack(); } catch (e) {} });
kick();
})();
</script>
<style>
.tk8{margin-top:16px;padding-top:14px;border-top:1px dashed var(--bd)}
.tk8>summary{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;font-weight:700;color:var(--goldtx);list-style:none;-webkit-tap-highlight-color:transparent}
.tk8>summary::-webkit-details-marker{display:none}
.tk8>summary::after{content:"";width:9px;height:9px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-top:-4px;transition:transform .2s}
.tk8[open]>summary::after{transform:rotate(225deg);margin-top:4px}
.tk8 ul{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.tk8 li{position:relative;padding-inline-start:22px;color:var(--mut);line-height:1.8;font-size:.95rem}
.tk8 li::before{content:"";position:absolute;inset-inline-start:0;top:.72em;width:8px;height:8px;border-radius:50%;background:var(--gold)}
</style>
<script>
(() => {
// ================= قسم «التنظيم» =================
if (typeof COMMS === 'undefined' || !Array.isArray(COMMS)) return;

const NEW = [
  {k: 'org', t: 'قسم التنظيم', i: 'grid', d: 'عملية توزيع المهام والمسؤوليات وتنسيق جهود الأعضاء ومتابعة العمل لضمان تحقيق أهداف النادي.'}
];
// مهام كل قسم (تظهر في بطاقة القسم بالصفحة الرئيسية). يمكن إضافة أقسام أخرى هنا بنفس الطريقة.
const TASKS = {
  org: [
    'توزيع المهام والمسؤوليات',
    'وضع الخطط وتنظيم الوقت',
    'التنسيق بين الأعضاء والفرق',
    'متابعة تنفيذ المهام',
    'تنظيم الاجتماعات والفعاليات',
    'حل المشكلات وضمان الانضباط'
  ]
};

let added = false;
NEW.forEach(n => { if (!COMMS.some(c => c.k === n.k)) { COMMS.push(n); added = true; } });

const FRL = (() => { try { return localStorage.getItem('lst_lang') === 'fr'; } catch (e) { return false; } })();
const HAS_AR = /[ء-ي]/;

// الوضع الفرنسي: أوصاف الأقسام الثلاثة القديمة (تطبق حسب مفتاح القسم، فلا تتأثر بأي اختلاف بسيط في النص العربي)
if (FRL) {
  const FRD = {
    hr: "Chargé de la gestion des membres du club. Il s'occupe du recrutement, de l'organisation interne, du suivi des équipes et du maintien d'un bon climat de travail afin d'assurer une coordination efficace entre tous les membres.",
    ext: "Chargé de la communication entre le club et ses partenaires, sponsors et autres organismes. Il est responsable de la diffusion de l'information, de la gestion des collaborations et du maintien d'une image positive du club à l'extérieur.",
    design: "Responsable de la création de l'identité visuelle du club. Il conçoit les affiches, les publications des réseaux sociaux, les vidéos, les photos et tous les contenus créatifs. Il contribue aussi à promouvoir les activités du club de manière attrayante et professionnelle."
  };
  COMMS.forEach(c => { if (FRD[c.k] && HAS_AR.test(c.d || '')) { c.d = FRD[c.k]; added = true; } });
}

// نصوص عامة في الموقع تذكر عدد الأقسام أو لم تترجم بعد (تطبق على النص الظاهر)
const RULES = FRL ? [
  [/ثلاث\s+لجان\s+متخصصة\s+تعمل\s+جنب\S*\s+إلى\s+جنب/, 'Quatre comités spécialisés qui travaillent main dans la main'],
  [/تثبيت\s+التطبيق/, "Installer l'application"],
  [/\bdes trois départements\b/, 'des quatre départements'],
  [/^\s*مجتمع\s+طلابي\s+يعمل\s+على\s+نشر[\s\S]*$/, "Une communauté d'étudiants qui œuvre à diffuser la culture scientifique et à développer les compétences de recherche et les compétences techniques depuis 2024, avec un programme riche d'ateliers, d'événements et de projets tout au long de l'année."]
] : [
  [/ثلاث\s+لجان/, 'أربع لجان'],
  [/الأقسام\s+الثلاثة/, 'الأقسام الأربعة']
];
const fixNode = n => {
  try {
    const t = n.data; if (!t || t.length < 4) return;
    const p = n.parentElement; if (!p || p.closest('[data-nofr],textarea,script,style')) return;
    for (const [re, to] of RULES) { if (re.test(t)) { n.data = t.replace(re, to); return; } }
  } catch (e) {}
};
const fixTree = root => {
  if (!root) return;
  if (root.nodeType === 3) return fixNode(root);
  if (root.nodeType !== 1) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n; while ((n = w.nextNode())) fixNode(n);
};

// يضيف قائمة «مهام القسم» داخل بطاقات الأقسام (الصفحة الرئيسية). التطابق بالترتيب، فلا يتأثر بلغة الواجهة.
const decorate = () => {
  try {
    document.querySelectorAll('.cards').forEach(box => {
      const cards = Array.from(box.children).filter(e => e.classList.contains('cd'));
      if (cards.length !== COMMS.length || cards.some(e => e.querySelector('.ico.g'))) return;
      cards.forEach((el, i) => {
        const list = TASKS[COMMS[i].k];
        if (!list || el.querySelector('.tk8')) return;
        el.insertAdjacentHTML('beforeend', '<details class="tk8"><summary>مهام القسم</summary><ul>' + list.map(x => '<li>' + x + '</li>').join('') + '</ul></details>');
      });
    });
  } catch (e) { console.error(e); }
};

let tm = 0;
const kick = () => { if (!tm) tm = setTimeout(() => { tm = 0; decorate(); }, 30); };

const _render = window.render;
if (typeof _render === 'function') {
  window.render = async function () { const r = await _render.apply(this, arguments); decorate(); return r; };
}
const m = typeof main !== 'undefined' ? main : document.getElementById('main');
if (m) new MutationObserver(kick).observe(m, {childList: true, subtree: true});
new MutationObserver(ms => { for (const x of ms) { if (x.type === 'characterData') fixNode(x.target); else x.addedNodes.forEach(fixTree); } })
  .observe(document.body, {childList: true, subtree: true, characterData: true});

// حارس أمان: لو لم يتم تعديل السطر const HORD في كتلة الدفعة 4 يتجاهل النموذج رئاسة التنظيم ويحفظ بدونها بصمت.
// نمنع الحفظ عندها ونظهر تنبيها بدل أن تضيع الرئاسة.
document.addEventListener('submit', e => {
  const f = e.target;
  if (!f || f.id !== 'rlf') return;
  const o = f.querySelector('input[name="h"][value="org"]');
  if (!o || !o.checked || o.disabled) return;
  const sl = f.elements.c;
  if (sl && sl.querySelector('option[value="org"]') && !sl.querySelector('option[value=""]')) return;
  e.preventDefault(); e.stopImmediatePropagation();
  toast('لم يكتمل تفعيل قسم التنظيم: يجب تعديل السطر const HORD في كتلة الدفعة 4 (انظر التعليمات) ثم إعادة المحاولة');
}, true);

// إن كانت صفحة معروضة فعلا (الرئيسية أو نموذج الانضمام أو المرشحات) نعيد رسمها لتظهر الأقسام الجديدة
if (added && m && m.querySelector('.cards, input[name="comm"], #fc, #mc, #tkc')) {
  try { Promise.resolve(window.render()).catch(() => {}); } catch (e) {}
}
decorate();
fixTree(document.body);
})();
</script>
</body>
