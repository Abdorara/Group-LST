  await loadActs();
  const a = AP(), c = s => a.filter(p => p.status === s).length, dep = {};
  a.forEach(p => dep[p.specialization] = (dep[p.specialization] || 0) + 1);
  const mx = Math.max(1, ...Object.values(dep));
  $('#ac').innerHTML = `<h1>نظرة عامة</h1><p class="sub">ملخص حالة الانضمام والفعاليات – بيانات محدّثة لحظياً</p>
  <a class="btn navy" href="#admin" data-tab="rq" style="margin-bottom:20px">${ic('users',20)}إدارة الطلبات</a>
  <div class="kg">${kpi('users','',a.length,'إجمالي المتقدمين')}${kpi('check','ok',c('approved'),'أعضاء مقبولون')}${kpi('clock','warn',c('pending'),'طلبات قيد المراجعة')}${kpi('xc','no',c('rejected'),'طلبات مرفوضة')}</div>
  <div class="pan"><h3><i>${ic('graduation',24)}</i>المتقدمون حسب القسم</h3>${Object.keys(dep).length ? Object.entries(dep).map(([k,n]) => `<div class="br"><div class="t"><span>${esc(k)}</span><span>${n}</span></div><div class="tr"><i style="width:${n / mx * 100}%"></i></div></div>`).join('') : '<p class="mut">لا توجد بيانات بعد.</p>'}</div>
  <div class="pan"><h3><i class="g">${ic('calendar',24)}</i>لمحة سريعة</h3><div class="ar" style="background:var(--blue);border-radius:18px;padding:16px 20px;margin-bottom:14px"><b style="color:#27418f">فعاليات قادمة</b><b style="font-size:1.6rem">${acts.filter(x => !isPast(x)).length}</b></div>
  ${COMMS.map(x => `<div class="ar" style="padding:8px 4px"><span>${x.t}</span><span class="mut">${a.filter(p => p.committee === x.k).length} متقدم</span></div>`).join('')}
  <a href="#admin" data-tab="ev" style="font-weight:700;display:inline-flex;gap:8px;margin-top:10px">${ic('ext',18)}إدارة الفعاليات</a></div>
  <div class="pan"><div class="ar" style="margin-bottom:10px"><h3 style="margin:0">أحدث الطلبات</h3><a href="#admin" data-tab="rq" style="font-weight:700">← عرض الكل</a></div>
  ${a.slice(0,5).map(p => `<div class="who" style="padding:14px 0;border-top:1px solid var(--bd)"><span class="av" style="background:var(--navy);color:#fff">${esc(ini(p.full_name))}</span><div><b>${esc(p.full_name)}</b><small class="mut" style="display:block">${esc(p.specialization)} · ${esc(cn(p.committee))}</small></div></div>`).join('') || '<p class="mut">لا توجد طلبات بعد.</p>'}</div>`;
}

function filt(kind){
  const q = ($('#q')?.value || '').trim().toLowerCase(), c = $('#fc')?.value || '', d = $('#fd')?.value || '';
  return AP().filter(p => (kind === 'mb' ? p.status === 'approved' && (mf === 'all' || p.committee === mf) : (rf === 'all' || p.status === rf))
    && (!c || p.committee === c) && (!d || p.specialization === d)
    && (!q || [p.full_name, p.card_no, p.phone, p.specialization].join(' ').toLowerCase().includes(q)));
}
const filterBox = () => `<div class="pan"><div class="sr"><input id="q" placeholder="ابحث بالاسم، الرقم الجامعي، الجوال…">${ic('search',20)}</div>
  <select id="fc"><option value="">كل اللجان</option>${COMMS.map(c => `<option value="${c.k}">${c.t}</option>`).join('')}</select>
  <select id="fd" style="margin-top:12px"><option value="">كل الأقسام</option>${DEPTS.map(d => `<option>${d}</option>`).join('')}</select></div>`;
const chips = (arr, cur, attr) => `<div class="fc">${arr.map(([k,t,n]) => `<button ${attr}="${k}" class="${cur === k ? 'on' : ''}">${t} (${n})</button>`).join('')}</div>`;

function tRq(){
  const a = AP(), n = s => s === 'all' ? a.length : a.filter(p => p.status === s).length;
  $('#ac').innerHTML = `<div class="ar"><div><h1>طلبات الانضمام</h1><p class="sub" id="rs"></p></div><button class="btn navy" data-a="csv" data-w="rq">${ic('download',20)}تصدير CSV</button></div>
  ${chips([['all','الكل',n('all')],['pending','قيد المراجعة',n('pending')],['approved','مقبول',n('approved')],['rejected','مرفوض',n('rejected')]], rf, 'data-rf')}
  ${filterBox()}<div id="tb"></div>`;
  const draw = () => { const l = filt('rq'); $('#rs').textContent = `${l.length} من ${a.length} طلب معروض`;
    $('#tb').innerHTML = `<div class="tw"><table><thead><tr><th>المتقدم</th><th>القسم</th><th>اللجنة</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>${l.map(p => `<tr>
    <td><div class="who"><span class="av">${esc(ini(p.full_name))}</span><div><b>${esc(p.full_name)}</b><small>${esc(p.card_no)}</small></div></div></td>
    <td>${esc(p.specialization)}<small>${esc(p.year || '')}</small></td><td>${esc(cn(p.committee))}</td>
    <td><span class="st2 s-${p.status}">${ST[p.status]}</span></td>
    <td><div class="ar" style="justify-content:flex-start;gap:8px"><button class="btn line sm" data-a="view" data-id="${p.id}">عرض</button>${p.status !== 'approved' ? `<button class="btn ok sm" data-a="appr" data-id="${p.id}">قبول</button>` : ''}${p.status !== 'rejected' && p.role !== 'admin' ? `<button class="btn no sm" data-a="rej" data-id="${p.id}">رفض</button>` : ''}</div></td></tr>`).join('') || '<tr><td colspan="5" class="c mut">لا توجد نتائج</td></tr>'}</tbody></table></div>`; };
  ['q','fc','fd'].forEach(i => { $('#' + i).oninput = draw; $('#' + i).onchange = draw; }); draw();
}

function tMb(){
  const a = AP().filter(p => p.status === 'approved');
  $('#ac').innerHTML = `<div class="ar"><div><h1>أعضاء النادي</h1><p class="sub" id="rs"></p></div><button class="btn navy" data-a="csv" data-w="mb">${ic('download',20)}تصدير CSV</button></div>
  ${chips([['all','الكل',a.length], ...COMMS.map(c => [c.k, c.t, a.filter(p => p.committee === c.k).length])], mf, 'data-mf')}
  ${filterBox()}<div id="tb"></div>`;
  const draw = () => { const l = filt('mb'); $('#rs').textContent = `${a.length} عضو – ${l.length} معروض`;
    $('#tb').innerHTML = `<div class="tw"><table><thead><tr><th>العضو</th><th>القسم</th><th>اللجنة</th><th>الجوال</th><th>إجراء</th></tr></thead><tbody>${l.map(p => `<tr>
    <td><div class="who"><span class="av">${esc(ini(p.full_name))}</span><div><b>${esc(p.full_name)}</b><small>${esc(p.card_no)} · انضم ${new Date(p.created_at).toLocaleDateString('ar-u-nu-latn', {dateStyle:'medium'})}</small></div></div></td>
    <td>${esc(p.specialization)}<small>${esc(p.year || '')}</small></td><td>${esc(cn(p.committee))}</td><td>${esc(p.phone || '—')}</td>
    <td>${p.role === 'admin' ? '<span class="badge">مشرف</span>' : `<button class="btn no sm" data-a="rej" data-id="${p.id}">إيقاف</button>`}</td></tr>`).join('') || '<tr><td colspan="5" class="c mut">لا توجد نتائج</td></tr>'}</tbody></table></div>`; };
  ['q','fc','fd'].forEach(i => { $('#' + i).oninput = draw; $('#' + i).onchange = draw; }); draw();
}

async function tEv(){
  await loadActs();
  const up = acts.filter(a => !isPast(a)).length;
  $('#ac').innerHTML = `<h1>إدارة الفعاليات والإعلانات</h1><p class="sub">انشر فعاليات جديدة لتظهر مباشرة في صفحة الفعاليات العامة</p>
  <form class="pan" id="af"><h3><i class="g">${ic('calplus',24)}</i>فعالية جديدة</h3>
   <div class="fl" style="margin-top:0">عنوان الفعالية</div><input name="ttl" required placeholder="مثال: ورشة عمل: مدخل إلى علم البيانات">
   <div class="g2"><div><div class="fl">التاريخ</div><input type="date" name="dt" required></div><div><div class="fl">الوقت (اختياري)</div><input type="time" name="tm"></div></div>
   <div class="fl">الموقع</div><input name="loc" placeholder="مثال: قاعة المؤتمرات – المبنى الرئيسي">
   <div class="fl">رابط التسجيل (اختياري)</div><input name="lnk" type="url" placeholder="https://forms.gle/…">
   <div class="fl">عدد المقاعد (اختياري)</div><input name="cap" type="number" min="1">
   <div class="fl">الوصف</div><textarea name="dsc" placeholder="وصف موجز للفعالية وما ينتظر الحضور…"></textarea>
   <button class="btn navy block" style="margin-top:22px">نشر الفعالية ${ic('ext',20)}</button></form>
  <h2 style="margin:26px 0 14px;font-size:1.5rem">الفعاليات القادمة <span class="cnt">${up}</span></h2>
  ${acts.slice().reverse().map(a => `<div class="pan"><div class="ar"><div><b>${esc(a.title)}</b> ${isPast(a) ? '<span class="st2 s-rejected">منتهية</span>' : ''}<div class="mut">${fd(a.event_date)}${a.location ? ' · ' + esc(a.location) : ''}</div></div>
   <div class="ar" style="gap:8px"><button class="btn line sm" data-a="regs" data-id="${a.id}">المسجلون</button><button class="btn no sm" data-a="del" data-id="${a.id}">حذف</button></div></div><div id="rg${a.id}" class="mut" style="margin-top:8px;line-height:2"></div></div>`).join('') || '<div class="pan c mut">لا توجد فعاليات بعد – أضف أول فعالية من النموذج أعلاه.</div>'}`;
  $('#af').onsubmit = async e => {
    e.preventDefault(); const f = e.target;
    const {error} = await sb.from('activities').insert({title: f.ttl.value.trim(), description: f.dsc.value.trim(), location: f.loc.value.trim(),
      event_date: f.dt.value ? new Date(f.dt.value + 'T' + (f.tm.value || '00:00')).toISOString() : null,
      reg_link: f.lnk.value.trim() || null, capacity: f.cap.value ? +f.cap.value : null});
    if (error) return toast('تعذّر النشر'); toast('تم نشر الفعالية ✓'); tEv();
  };
}

function tSt(){
  const fld = (l, k, type = 'text') => `<div class="fl" style="margin-top:14px">${l}</div><input name="${k}" type="${type}" value="${esc(S[k] || '')}">`;
  $('#ac').innerHTML = `<h1>الإعدادات</h1><p class="sub">معلومات النادي وقنوات التواصل – تظهر مباشرة في الموقع العام بعد الحفظ.</p>
  <form id="sf"><div class="pan"><h3><i>${ic('building',24)}</i>معلومات النادي</h3>${fld('اسم النادي','club_name')}${fld('الجامعة','university')}
   <div class="fl" style="margin-top:14px">نبذة عن النادي (تظهر في تذييل الموقع)</div><textarea name="about">${esc(S.about || '')}</textarea></div>
  <div class="pan"><h3><i class="g">${ic('sparkles',24)}</i>معلومات التواصل</h3>${fld('البريد الإلكتروني','email','email')}${fld('رقم الهاتف','phone')}${fld('رقم الواتساب (بالصيغة الدولية)','whatsapp')}${fld('المقر / العنوان','address')}${fld('رابط انستغرام (اختياري)','instagram','url')}${fld('رابط إكس / تويتر (اختياري)','x_link','url')}</div>
  <button class="btn navy">${ic('save',20)}حفظ الإعدادات</button></form>
  <div class="pan" style="margin-top:20px"><h3><i>${ic('key',24)}</i>حسابي</h3><div class="ar"><div><b>${esc(me.full_name)}</b><div class="mut">${esc(me.card_no)}</div></div><span class="badge">مدير</span></div></div>`;
  $('#sf').onsubmit = async e => {
    e.preventDefault(); const f = e.target, o = {};
    ['club_name','university','about','email','phone','whatsapp','address','instagram','x_link'].forEach(k => o[k] = f[k].value.trim());
    const {error} = await sb.from('settings').update(o).eq('id', 1);
    if (error) return toast('تعذّر الحفظ'); await loadSettings(); toast('تم حفظ الإعدادات ✓');
  };
}

function csv(kind){
  const l = filt(kind), h = ['الاسم','الرقم الجامعي','الجوال','القسم','السنة','اللجنة','الحالة','سبب الانضمام','التاريخ'];
  const q = x => { let s = String(x ?? ''); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const r = [h, ...l.map(p => [p.full_name, p.card_no, p.phone, p.specialization, p.year, cn(p.committee), ST[p.status], p.motivation, new Date(p.created_at).toLocaleDateString('en-GB')])];
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + r.map(x => x.map(q).join(',')).join('\n')], {type:'text/csv;charset=utf-8'}));
  a.download = (kind === 'mb' ? 'members' : 'requests') + '.csv'; a.click();
}

function showP(id){
  const p = P.find(x => x.id === id); if (!p) return;
  $('#modal').innerHTML = `<div class="box"><button class="ib" data-a="mx" style="position:absolute;left:14px;top:14px;font-size:1.2rem">✕</button>
  <h3 style="font-size:1.4rem;margin-bottom:6px">${esc(p.full_name)}</h3><span class="st2 s-${p.status}">${ST[p.status]}</span>
  <dl class="dl"><dt>الرقم الجامعي</dt><dd>${esc(p.card_no)}</dd><dt>الجوال</dt><dd>${esc(p.phone || '—')}</dd><dt>القسم</dt><dd>${esc(p.specialization)}</dd><dt>السنة</dt><dd>${esc(p.year || '—')}</dd><dt>اللجنة</dt><dd>${esc(cn(p.committee))}</dd><dt>تاريخ الطلب</dt><dd>${new Date(p.created_at).toLocaleDateString('ar-u-nu-latn', {dateStyle:'long'})}</dd></dl>
  <b>لماذا يريد الانضمام؟</b><p class="mut" style="margin-top:6px;line-height:2">${esc(p.motivation || '—')}</p>
  <div class="ar" style="justify-content:flex-start;gap:10px;margin-top:20px"><button class="btn line sm" data-a="cert" data-p="${esc(p.certificate_url)}">${ic('file',16)}الشهادة</button>
  ${p.status !== 'approved' ? `<button class="btn ok sm" data-a="appr" data-id="${p.id}">قبول</button>` : ''}${p.status !== 'rejected' && p.role !== 'admin' ? `<button class="btn no sm" data-a="rej" data-id="${p.id}">رفض</button>` : ''}</div></div>`;
  $('#modal').style.display = 'flex';
}

// ===== الأحداث =====
document.addEventListener('click', async e => {
  if (e.target.id === 'modal') { $('#modal').style.display = 'none'; return; }
  const t = e.target.closest('[data-tab]'); if (t) { e.preventDefault(); tab = t.dataset.tab; if (view === 'admin') adminTab(); return; }
  const rfb = e.target.closest('[data-rf]'); if (rfb) { rf = rfb.dataset.rf; return tRq(); }
  const mfb = e.target.closest('[data-mf]'); if (mfb) { mf = mfb.dataset.mf; return tMb(); }
  const el = e.target.closest('[data-a]'); if (!el) return;
  e.preventDefault();
  const a = el.dataset.a, id = el.dataset.id;
  if (a === 'menu') { const m = $('#menu'); m.style.display = m.style.display === 'block' ? 'none' : 'block'; return; }
  if (a === 'mx') { $('#modal').style.display = 'none'; return; }
  if (a === 'out') { await sb.auth.signOut(); me = null; stopRT(); unread = 0; MB = {}; MBL = []; await loadSettings(); nav('#home'); return; }
  if (a === 'refresh') { await loadMe(); return render(); }
  if (a === 'csv') return csv(el.dataset.w);
  if (a === 'join') {
    const {error} = await sb.from('registrations').insert({activity_id: +id, user_id: me.id});
    toast(error ? (/full/.test(error.message) ? 'اكتمل العدد' : 'تعذّر التسجيل') : 'تم تسجيلك ✓'); return render();
  }
  if (a === 'leave') { await sb.from('registrations').delete().eq('activity_id', +id).eq('user_id', me.id); toast('تم إلغاء التسجيل'); return render(); }
  if (a === 'dm') { const {error} = await sb.from('messages').delete().eq('id', id); if (error) return toast('تعذّر الحذف'); return $('#msg' + id)?.remove(); }
  if (a === 'ddm') { const {error} = await sb.from('dms').delete().eq('id', id); if (error) return toast('تعذّر الحذف'); return $('#dm' + id)?.remove(); }
  if (a === 'view') return showP(id);
  if (a === 'appr' || a === 'rej') {
    if (a === 'rej' && !confirm('تأكيد الرفض / الإيقاف؟')) return;
    const {error} = await sb.from('profiles').update({status: a === 'appr' ? 'approved' : 'rejected'}).eq('id', id);
    if (error) return toast('تعذّر التنفيذ'); $('#modal').style.display = 'none'; toast('تم'); return adminTab();
  }
  if (a === 'cert') {
    const {data, error} = await sb.storage.from('certificates').createSignedUrl(el.dataset.p, 120);
    return error ? toast('تعذّر فتح الملف') : window.open(data.signedUrl, '_blank');
  }
  if (a === 'del') { if (!confirm('حذف الفعالية نهائياً؟')) return; await sb.from('activities').delete().eq('id', id); return tEv(); }
  if (a === 'regs') {
    const box = $('#rg' + id); box.textContent = '…';
    const {data} = await sb.from('registrations').select('profiles(full_name,card_no,specialization)').eq('activity_id', id);
    box.innerHTML = (data || []).length ? data.map((r, i) => `${i + 1}. ${esc(r.profiles.full_name)} — ${esc(r.profiles.specialization)} (${esc(r.profiles.card_no)})`).join('<br>') : 'لا يوجد مسجلون بعد.';
  }
});

(async () => { main.innerHTML = loader; await Promise.all([loadMe(), loadSettings()]); render(); })();
</script>
</body>
</html>
